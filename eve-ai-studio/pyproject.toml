[project]
name = "eve-ai-studio"
version = "0.1.0"
description = "Fondazione isolata del motore Eve AI Studio"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "pydantic-settings>=2.6,<3",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27,<1",
  "pytest>=8.3,<10",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[package]
name = "aula-studio-virtuale"
version = "1.4.0-alpha.12"
description = "Aula Studio Virtuale desktop"
authors = ["Aula Studio Virtuale"]
edition = "2021"

[lib]
name = "aula_studio_virtuale_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-updater = "2"

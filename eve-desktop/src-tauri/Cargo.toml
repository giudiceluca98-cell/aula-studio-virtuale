[package]
name = "eve-ai-studio-desktop"
version = "1.2.0-alpha.12"
description = "Eve AI Studio desktop"
authors = ["Aula Studio Virtuale"]
edition = "2021"

[lib]
name = "eve_ai_studio_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
base64 = "0.22"
minisign-verify = "0.2"
rfd = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-updater = "2"

[package]
name = "eve-ai-studio-desktop"
version = "1.2.0-alpha.1"
description = "Eve AI Studio desktop"
authors = ["Aula Studio Virtuale"]
edition = "2021"

[lib]
name = "eve_ai_studio_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
tauri = { version = "2", features = [] }
tauri-plugin-updater = "2"


name: Finalizza Fase 3 alpha.2

on:
  push:
    branches:
      - demo-canonica
    paths:
      - .github/workflows/finalize-phase3-alpha2-clean.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  finalize-alpha-2:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout demo-canonica
        uses: actions/checkout@v4
        with:
          ref: demo-canonica
          fetch-depth: 0

      - name: Ripristina checkpoint alpha.1 e ripulisce i file tecnici
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --ff-only origin demo-canonica

          mkdir -p reference/checkpoints/phase-3
          git show c61b3ac6f985c4bc2792c4a1593b4e057c40b1ce:reference/demo-aula-studio-virtuale-canonica.html > reference/checkpoints/phase-3/demo-aula-studio-virtuale-1.3.0-alpha.1.html

          cat > reference/checkpoints/phase-3/README.md <<'EOF'
          # Checkpoint scaricabili — Fase 3

          La fonte autorevole resta `reference/demo-aula-studio-virtuale-canonica.html`.

          - `1.3.0-alpha.1` — `demo-aula-studio-virtuale-1.3.0-alpha.1.html` — SHA-256 `a9cca058bf0029e71c4d53273da80c61057f12d579a355f0cdf191addfcaa6c6` — 624620 byte — 18408 righe
          - `1.3.0-alpha.2` — `demo-aula-studio-virtuale-1.3.0-alpha.2.html` — SHA-256 `41d16b4dc64f6d86bafff282620228866f05459928c5ebda8506834839c43628` — 639741 byte — 18474 righe
          EOF

          rm -f \
            .github/workflows/apply-demo-materials-panel.yml \
            .github/workflows/apply-demo-phase3-complete.yml \
            .github/workflows/apply-phase3-alpha2-clean.yml \
            .github/workflows/verify-phase3-alpha1.yml \
            scripts/.phase3-trigger \
            scripts/apply-demo-materials-panel.py \
            scripts/apply-demo-phase3-complete.py \
            scripts/harden-demo-phase3.py

      - name: Verifica checkpoint alpha.1 e alpha.2
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import hashlib
          import re

          alpha1 = Path('reference/checkpoints/phase-3/demo-aula-studio-virtuale-1.3.0-alpha.1.html')
          alpha2 = Path('reference/checkpoints/phase-3/demo-aula-studio-virtuale-1.3.0-alpha.2.html')
          canonical = Path('reference/demo-aula-studio-virtuale-canonica.html')

          data1 = alpha1.read_bytes()
          data2 = alpha2.read_bytes()
          current = canonical.read_bytes()

          assert len(data1) == 624620
          assert data1.count(b'\n') + 1 == 18408
          assert hashlib.sha256(data1).hexdigest() == 'a9cca058bf0029e71c4d53273da80c61057f12d579a355f0cdf191addfcaa6c6'

          assert len(data2) == 639741
          assert data2.count(b'\n') + 1 == 18474
          assert hashlib.sha256(data2).hexdigest() == '41d16b4dc64f6d86bafff282620228866f05459928c5ebda8506834839c43628'
          assert current == data2

          html = current.decode('utf-8')
          required = [
              'MATERIALI E WORKSPACE — PANNELLO MATERIALI 1.3.0-alpha.1',
              'MATERIALI E WORKSPACE — UPLOAD E LINK 1.3.0-alpha.2',
              'materialAddDialog',
              'aulaMaterialAddSubmit',
              'aulaMaterialSafeHttps',
              'Massimo 10 MB',
              'ARCHIVIATA26',
              'NEGATO2026',
              'OFFLINE2026',
          ]
          for marker in required:
              assert marker in html, marker

          ids = [value for value in re.findall(r'\bid=["\']([^"\']+)["\']', html) if '${' not in value]
          duplicates = sorted({value for value in ids if ids.count(value) > 1})
          assert not duplicates, duplicates
          assert html.count('<script') == html.count('</script>')
          assert html.count('<style') == html.count('</style>')
          assert html.rstrip().endswith('</html>')
          print('Verifica statica alpha.1 e alpha.2 completata')
          PY

      - name: Verifica JavaScript inline alpha.2
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/alpha2-js
          mkdir -p /tmp/alpha2-js
          python - <<'PY'
          from pathlib import Path
          import re

          html = Path('reference/demo-aula-studio-virtuale-canonica.html').read_text(encoding='utf-8')
          scripts = re.findall(r'<script([^>]*)>(.*?)</script>', html, flags=re.I | re.S)
          output = Path('/tmp/alpha2-js')
          count = 0
          for attrs, body in scripts:
              type_match = re.search(r'type=["\']([^"\']+)', attrs, flags=re.I)
              script_type = type_match.group(1).lower() if type_match else ''
              if script_type and script_type not in {'text/javascript', 'application/javascript'}:
                  continue
              if 'src=' in attrs.lower() or not body.strip():
                  continue
              (output / f'script-{count}.js').write_text(body, encoding='utf-8')
              count += 1
          assert count > 0
          print(f'Script estratti: {count}')
          PY
          for file in /tmp/alpha2-js/*.js; do
            node --check "$file"
          done

      - name: Commit finale alpha.2
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/finalize-phase3-alpha2-clean.yml
          git add -A
          git diff --cached --quiet && { echo 'Nessuna modifica da registrare'; exit 1; }
          git commit -m "[phase3][materials-upload-link] Finalizza checkpoint 1.3.0-alpha.2"
          git push origin HEAD:demo-canonica

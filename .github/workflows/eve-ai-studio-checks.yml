name: Eve AI Studio checks

on:
  push:
    branches: [eve-ai-studio]
    paths:
      - "eve-ai-studio/**"
      - "reference/eve-ai-studio-preview/**"
      - ".github/workflows/eve-ai-studio-checks.yml"
  pull_request:
    branches: [eve-ai-studio]
    paths:
      - "eve-ai-studio/**"
      - "reference/eve-ai-studio-preview/**"
      - ".github/workflows/eve-ai-studio-checks.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: eve-ai-studio-core-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-core:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: eve-ai-studio/pyproject.toml

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Installa servizio e dipendenze di test
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e "eve-ai-studio[dev]"

      - name: Compila Python
        working-directory: eve-ai-studio
        run: python -m compileall -q app tests

      - name: Esegue suite cumulativa
        working-directory: eve-ai-studio
        run: python -m pytest -q --junitxml=pytest-results.xml

      - name: Verifica tutti i JavaScript della sorgente canonica
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            node --check "$file"
          done < <(find reference/eve-ai-studio-preview -type f -name '*.js' -print0)

      - name: Verifica unicità della sorgente canonica
        shell: bash
        run: |
          set -euo pipefail
          test -s reference/eve-ai-studio-preview/index.html
          test ! -e reference/eve-ai-studio-preview/EVE_AI_STUDIO_STANDALONE.html
          test ! -e reference/eve-ai-studio-preview/build_standalone.py
          test "$(find reference/eve-ai-studio-preview -maxdepth 1 -type f -name '*.html' | wc -l)" -eq 1

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eve-ai-studio-core-results
          path: eve-ai-studio/pytest-results.xml
          if-no-files-found: warn
          retention-days: 14

name: Eve AI Studio current preview diagnostic
# Rilancio sul listener di navigazione isolato.

on:
  push:
    branches:
      - eve-ai-studio
    paths:
      - ".github/workflows/eve-ai-studio-current-preview-diagnostic.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: eve-ai-studio
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Installa Chromium
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium

      - name: Avvia preview
        run: |
          python3 -m http.server 4173 --directory reference/eve-ai-studio-preview >/tmp/eve-preview-http.txt 2>&1 &
          for attempt in {1..30}; do
            curl --fail --silent http://127.0.0.1:4173/index.html >/dev/null && exit 0
            sleep 1
          done
          exit 1

      - name: Esegui diagnostica corrente
        id: browser
        continue-on-error: true
        run: |
          mkdir -p eve-ai-studio/checkpoints
          cat > diagnose-current-preview.mjs <<'EOF'
          import { chromium } from "playwright";
          import fs from "node:fs";

          const result = { consoleErrors: [], pageErrors: [], scenarios: {}, state: {} };
          const browser = await chromium.launch({ headless: true });
          const page = await browser.newPage({ viewport: { width: 1440, height: 2200 } });
          page.on("console", message => { if (message.type() === "error") result.consoleErrors.push(message.text()); });
          page.on("pageerror", error => result.pageErrors.push(error.stack || error.message));

          async function run(name, action) {
            try { await action(); result.scenarios[name] = { passed: true }; }
            catch (error) { result.scenarios[name] = { passed: false, error: error.stack || error.message }; }
          }

          try {
            await page.goto("http://127.0.0.1:4173/index.html", { waitUntil: "networkidle" });
            await page.waitForFunction(() => window.EveAnimationLibrary?.setState && document.getElementById("sourceOpeningPanel"), null, { timeout: 20000 });

            await run("navigation", async () => {
              const buttons = page.locator('[data-view="rag-materials"]');
              const count = await buttons.count();
              if (count !== 1) throw new Error(`Voci rag-materials trovate: ${count}`);
              await buttons.click();
              if (!(await page.locator("#rag-materials").isVisible())) throw new Error("La vista rag-materials non è visibile dopo il click");
            });

            await run("animations", async () => {
              for (const state of ["eve-idle","eve-thinking","eve-processing","eve-reading-indexing","eve-success","eve-error-supportive","eve-confirmation-needed"]) {
                await page.evaluate(value => window.EveAnimationLibrary.setState(value), state);
              }
            });

            await run("materials", async () => {
              await page.locator("#materialScenario").selectOption("valid");
              await page.locator("#runMaterialImport").click();
              await page.waitForFunction(() => !document.getElementById("runMaterialImport").disabled);
              const text = await page.locator("#materialImportHistory").textContent();
              if (!/ready/.test(text || "")) throw new Error(text || "Cronologia vuota");
            });

            await run("retrieval", async () => {
              await page.locator("#retrievalScenario").selectOption("normal");
              await page.locator("#retrievalScenario").dispatchEvent("change");
              await page.locator("#runRetrievalSearch").click();
              const text = await page.locator("#retrievalResults").textContent();
              if (!/Citazione verificata/.test(text || "")) throw new Error(text || "Risultati vuoti");
            });

            await run("rag", async () => {
              await page.locator("#ragChatScenario").selectOption("grounded");
              await page.locator("#ragChatScenario").dispatchEvent("change");
              await page.locator("#runRagChat").click();
              const text = await page.locator("#ragChatAnswer").textContent();
              if (!/\[1\]/.test(text || "")) throw new Error(text || "Risposta vuota");
            });

            await run("source_opening", async () => {
              await page.locator("#sourceOpeningScenario").selectOption("verified");
              await page.locator("#sourceOpeningScenario").dispatchEvent("change");
              await page.locator("#openVerifiedSource").click();
              const text = await page.locator("#sourceOpeningResult").textContent();
              if (!/Integrità verificata/.test(text || "")) throw new Error(text || "Fonte vuota");
            });

            result.state = await page.evaluate(() => ({
              assetPayloadLength: window.__EVE_OFFICIAL_GZIP_B64?.length || 0,
              workflowPayloadLength: window.__EVE_OFFICIAL_WORKFLOW_GZIP_B64?.length || 0,
              horizontalOverflow: document.documentElement.scrollWidth > document.documentElement.clientWidth,
              scrollWidth: document.documentElement.scrollWidth,
              clientWidth: document.documentElement.clientWidth,
            }));
          } catch (error) {
            result.fatal = error.stack || error.message;
          } finally {
            await browser.close();
          }

          result.passed = !result.fatal && !result.consoleErrors.length && !result.pageErrors.length && !result.state.horizontalOverflow && Object.values(result.scenarios).every(item => item.passed);
          fs.writeFileSync("eve-ai-studio/checkpoints/EVE_CURRENT_PREVIEW_DIAGNOSTIC.json", JSON.stringify(result, null, 2));
          if (!result.passed) process.exitCode = 1;
          EOF
          node diagnose-current-preview.mjs

      - name: Salva rapporto
        if: always()
        run: |
          test -f eve-ai-studio/checkpoints/EVE_CURRENT_PREVIEW_DIAGNOSTIC.json || printf '{"passed":false,"fatal":"diagnostic_not_created"}\n' > eve-ai-studio/checkpoints/EVE_CURRENT_PREVIEW_DIAGNOSTIC.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f eve-ai-studio/checkpoints/EVE_CURRENT_PREVIEW_DIAGNOSTIC.json
          git commit -m "ci: salva diagnostica corrente preview [skip eve ci]" || exit 0
          git pull --rebase origin eve-ai-studio
          git push origin HEAD:eve-ai-studio

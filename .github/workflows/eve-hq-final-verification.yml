name: Eve AI Studio modular preview verification

on:
  push:
    branches: [eve-ai-studio]
    paths:
      - "reference/eve-ai-studio-preview/**"
      - ".github/workflows/eve-hq-final-verification.yml"
  pull_request:
    branches: [eve-ai-studio]
    paths:
      - "reference/eve-ai-studio-preview/**"
      - ".github/workflows/eve-hq-final-verification.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: eve-preview-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Installa Playwright e Chromium
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium

      - name: Avvia la sola preview modulare
        run: |
          python3 -m http.server 4173 --directory reference/eve-ai-studio-preview >/tmp/eve-preview-http.txt 2>&1 &
          for attempt in {1..30}; do
            curl -fsS http://127.0.0.1:4173/index.html >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/eve-preview-http.txt
          exit 1

      - name: Verifica runtime, 64 asset, galleria e caricamento progressivo
        run: |
          cat > verify-eve-preview.mjs <<'EOF'
          import { chromium } from "playwright";
          import assert from "node:assert/strict";
          import fs from "node:fs";

          const browser = await chromium.launch({ headless: true });
          const page = await browser.newPage({ viewport: { width: 1440, height: 1200 } });
          const errors = [];
          page.on("pageerror", error => errors.push(error.message));
          page.on("console", message => {
            if (message.type() === "error") errors.push(message.text());
          });

          try {
            await page.goto("http://127.0.0.1:4173/index.html", { waitUntil: "load" });
            await page.waitForFunction(
              () => window.EveAnimationLibrary?.listStates?.().length === 64,
              null,
              { timeout: 60000 }
            );
            assert.equal(await page.locator("script[src*='model-test-workflow.js']").count(), 0);
            assert.equal(await page.locator("script[src*='model-rules-workflow.js']").count(), 0);
            await page.getByRole("button", { name: "Prova Eve" }).click();
            await page.waitForFunction(
              () => [...document.scripts].some(script => script.src.includes("model-rules-workflow.js")),
              null,
              { timeout: 30000 }
            );
            await page.locator("#openAnimationLibraryBtn").click();
            await page.waitForFunction(
              () => document.querySelectorAll("#animationLibraryGrid .animation-card").length === 64,
              null,
              { timeout: 60000 }
            );
            assert.equal(await page.locator("#animationLibraryGrid .animation-card").count(), 64);
            assert.equal(await page.evaluate(() => document.documentElement.scrollWidth <= document.documentElement.clientWidth), true);
            assert.deepEqual(errors, []);
            await page.screenshot({ path: "eve-preview-modular.png", fullPage: true });
            fs.writeFileSync("EVE_PREVIEW_VERIFICATION.json", JSON.stringify({
              passed: true,
              format: "modular",
              assets: 64,
              standalone: false
            }, null, 2));
          } finally {
            await browser.close();
          }
          EOF
          node verify-eve-preview.mjs

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eve-modular-preview-verification
          path: |
            eve-preview-modular.png
            EVE_PREVIEW_VERIFICATION.json
            /tmp/eve-preview-http.txt
          if-no-files-found: warn
          retention-days: 14

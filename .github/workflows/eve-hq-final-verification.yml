name: Eve HQ final verification

on:
  push:
    branches:
      - eve-ai-studio
    paths:
      - ".github/workflows/eve-hq-final-verification.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify-hq:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout eve-ai-studio
        uses: actions/checkout@v4
        with:
          ref: eve-ai-studio
          fetch-depth: 0

      - name: Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Installa Playwright e Chromium
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium

      - name: Avvia preview modulare
        run: |
          python3 -m http.server 4173 --directory reference/eve-ai-studio-preview >/tmp/eve-hq-http.txt 2>&1 &
          for attempt in {1..30}; do
            curl -fsS http://127.0.0.1:4173/index.html >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/eve-hq-http.txt
          exit 1

      - name: Verifica 64 stati, qualità e funzioni
        run: |
          cat > verify-eve-hq-final.mjs <<'EOF'
          import { chromium } from "playwright";
          import assert from "node:assert/strict";
          import fs from "node:fs";
          import path from "node:path";
          import { pathToFileURL } from "node:url";

          async function verifyAnimations(page, url, expectedFormat) {
            const errors = [];
            page.on("pageerror", error => errors.push(`pageerror: ${error.message}`));
            page.on("console", message => {
              if (message.type() === "error") errors.push(`console: ${message.text()}`);
            });

            await page.goto(url, { waitUntil: "load" });
            await page.waitForFunction(
              () => window.EveAnimationLibrary?.quality === "original-final-webp",
              null,
              { timeout: 30000 }
            );

            const states = await page.evaluate(() => window.EveAnimationLibrary.listStates());
            assert.equal(states.length, 64);

            for (const asset of states) {
              const result = await page.evaluate(async selected => {
                await window.EveAnimationLibrary.setState(selected.id, { restart: true });
                const image = document.getElementById("eveHqPortrait");
                await image.decode().catch(() => {});
                return {
                  width: image.naturalWidth,
                  height: image.naturalHeight,
                  sha256: image.dataset.eveSha256,
                  quality: image.dataset.eveQuality,
                  state: image.dataset.eveState,
                };
              }, asset);

              assert.equal(result.width, asset.width);
              assert.equal(result.height, asset.height);
              assert.equal(result.sha256, asset.sha256);
              assert.equal(result.quality, "original");
              assert.equal(result.state, asset.id);
            }

            if (expectedFormat) {
              assert.equal(
                await page.locator('meta[name="eve-preview-format"]').getAttribute("content"),
                expectedFormat
              );
              assert.equal(
                await page.locator('meta[name="eve-animation-quality"]').getAttribute("content"),
                "original-hq"
              );
            }

            assert.deepEqual(errors, []);
            return states;
          }

          const browser = await chromium.launch({ headless: true });
          const result = {
            passed: false,
            libraryVersion: "1.2.2",
            quality: "original-final-webp",
            assets: 0,
            modular: false,
            standaloneFile: false,
            interactions: false,
            errors: [],
          };

          try {
            const modular = await browser.newPage({ viewport: { width: 1440, height: 1800 }, deviceScaleFactor: 2 });
            const modularStates = await verifyAnimations(modular, "http://127.0.0.1:4173/index.html", null);
            result.assets = modularStates.length;
            result.modular = true;

            await modular.locator('[data-view="rag-materials"]').click();
            await modular.locator("#materialScenario").selectOption("valid");
            await modular.locator("#runMaterialImport").click();
            await modular.waitForFunction(() => !document.getElementById("runMaterialImport").disabled);
            assert.match(await modular.locator("#materialImportHistory").textContent(), /ready/);

            await modular.locator("#retrievalScenario").selectOption("normal");
            await modular.locator("#retrievalScenario").dispatchEvent("change");
            await modular.locator("#runRetrievalSearch").click();
            assert.match(await modular.locator("#retrievalResults").textContent(), /Citazione verificata/);

            await modular.locator("#ragChatScenario").selectOption("grounded");
            await modular.locator("#ragChatScenario").dispatchEvent("change");
            await modular.locator("#runRagChat").click();
            assert.match(await modular.locator("#ragChatAnswer").textContent(), /\[1\]/);

            await modular.locator("#sourceOpeningScenario").selectOption("verified");
            await modular.locator("#sourceOpeningScenario").dispatchEvent("change");
            await modular.locator("#openVerifiedSource").click();
            assert.match(await modular.locator("#sourceOpeningResult").textContent(), /Integrità verificata/);
            result.interactions = true;
            await modular.screenshot({ path: "eve-hq-final-modular.png", fullPage: true });

            const standalone = await browser.newPage({ viewport: { width: 1440, height: 1800 }, deviceScaleFactor: 2 });
            const standalonePath = path.resolve("reference/eve-ai-studio-preview/EVE_AI_STUDIO_STANDALONE.html");
            await verifyAnimations(standalone, pathToFileURL(standalonePath).href, "standalone");
            result.standaloneFile = true;
            await standalone.screenshot({ path: "eve-hq-final-standalone.png", fullPage: true });

            result.passed = true;
          } catch (error) {
            result.errors.push(error.stack || error.message);
            throw error;
          } finally {
            fs.writeFileSync("EVE_HQ_FINAL_VERIFICATION.json", JSON.stringify(result, null, 2));
            await browser.close();
          }
          EOF
          node verify-eve-hq-final.mjs

      - name: Salva rapporto definitivo
        if: always()
        run: |
          mkdir -p eve-ai-studio/checkpoints
          cp EVE_HQ_FINAL_VERIFICATION.json eve-ai-studio/checkpoints/EVE_HQ_FINAL_VERIFICATION.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f eve-ai-studio/checkpoints/EVE_HQ_FINAL_VERIFICATION.json
          git commit -m "ci: registra verifica finale animazioni Eve HQ" || exit 0
          git pull --rebase origin eve-ai-studio
          git push origin HEAD:eve-ai-studio

      - name: Pubblica screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eve-hq-final-verification
          path: |
            eve-hq-final-modular.png
            eve-hq-final-standalone.png
            EVE_HQ_FINAL_VERIFICATION.json
          if-no-files-found: warn
          retention-days: 14

name: Applica ruoli e presenza alla dashboard demo

on:
  push:
    branches:
      - demo-canonica
    paths:
      - .github/workflows/apply-demo-dashboard-roles-presence.yml
      - scripts/apply-demo-dashboard-roles-presence.py
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: demo-canonica-dashboard-roles-presence
  cancel-in-progress: false

jobs:
  apply-dashboard-roles-presence:
    if: ${{ !contains(github.event.head_commit.message || '', '[dashboard-roles-presence]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout demo-canonica
        uses: actions/checkout@v4
        with:
          ref: demo-canonica
          fetch-depth: 0

      - name: Applica ruoli e presenza
        run: python scripts/apply-demo-dashboard-roles-presence.py

      - name: Verifiche statiche
        shell: bash
        run: |
          python - <<'PY'
          import re
          from pathlib import Path

          html = Path('reference/demo-aula-studio-virtuale-canonica.html').read_text(encoding='utf-8')
          required = [
              'DASHBOARD REALE — RUOLI E PRESENZA 1.2.0-alpha.2',
              'id="portalPresenceDialog"',
              'id="portalPresenceList"',
              'function portalDashboardRenderRoomsWithPresence(',
              'function portalDashboardOpenPresence(',
              'portalDashboardPresencePresets',
              'Demo locale · presenza simulata',
              'in_call',
              'admin',
          ]
          for marker in required:
              assert marker in html, marker

          ids = [value for value in re.findall(r'\bid=["\']([^"\']+)["\']', html) if '${' not in value]
          duplicates = sorted({value for value in ids if ids.count(value) > 1})
          assert not duplicates, duplicates
          assert html.count('<script') == html.count('</script>')
          assert html.count('<style') == html.count('</style>')
          assert html.rstrip().endswith('</html>')
          print('Controlli statici superati')
          PY

      - name: Pubblica HTML come artefatto
        uses: actions/upload-artifact@v4
        with:
          name: demo-canonica-dashboard-1.2.0-alpha.2
          path: reference/demo-aula-studio-virtuale-canonica.html
          if-no-files-found: error
          retention-days: 30

      - name: Commit sul solo branch demo-canonica
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reference scripts/apply-demo-dashboard-roles-presence.py
          if git diff --cached --quiet; then
            echo "Nessuna modifica da registrare"
            exit 0
          fi
          git commit -m "[dashboard-roles-presence] Integra ruoli e presenza nella dashboard demo"
          git push origin HEAD:demo-canonica

name: Eve CORE 1.3 database checks

on:
  push:
    branches: [codex/eve-ai-studio-core-1-3]
    paths:
      - "supabase/**"
      - "src/features/eve/data/**"
      - "tests/eve-database-*.test.ts"
      - ".github/workflows/eve-core-1.3-database-checks.yml"
  pull_request:
    branches: [eve-ai-studio]
    paths:
      - "supabase/**"
      - "src/features/eve/data/**"
      - "tests/eve-database-*.test.ts"
      - ".github/workflows/eve-core-1.3-database-checks.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  temporary-supabase:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Avvia Supabase temporaneo
        shell: bash
        run: |
          set -euo pipefail
          test -f supabase/config.toml || supabase init
          supabase start

      - name: Applica tutte le migrazioni
        run: supabase db reset

      - name: Verifica RLS, isolamento e service role
        env:
          PGURL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
        run: psql "$PGURL" -v ON_ERROR_STOP=1 -f supabase/tests/core_1_3_rls.sql

      - name: Verifica backup e rollback protetto
        env:
          PGURL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
        shell: bash
        run: |
          set -euo pipefail
          pg_dump "$PGURL" --format=custom --file=/tmp/core-1.3-before-rollback.dump
          test -s /tmp/core-1.3-before-rollback.dump
          if psql "$PGURL" -v ON_ERROR_STOP=1 -f supabase/rollback/0018_eve_core_production_data.down.sql; then
            echo "Il rollback distruttivo non protetto doveva fallire" >&2
            exit 1
          fi
          {
            echo "set app.eve_allow_destructive_rollback = 'true';"
            cat supabase/rollback/0018_eve_core_production_data.down.sql
          } | psql "$PGURL" -v ON_ERROR_STOP=1
          test "$(psql "$PGURL" -Atc "select to_regclass('public.eve_prompt_families') is null")" = "t"

      - name: Arresta l'ambiente temporaneo
        if: always()
        run: supabase stop --no-backup

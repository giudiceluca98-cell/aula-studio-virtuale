name: Eve AI Studio standalone preview

on:
  push:
    branches: [eve-ai-studio]
    paths:
      - "reference/eve-ai-studio-preview/**"
      - ".github/workflows/eve-ai-studio-standalone-preview.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: eve-ai-studio-standalone-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-verify:
    if: github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message, '[skip eve standalone]')
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: eve-ai-studio
          fetch-depth: 0

      - name: Genera standalone
        id: build
        continue-on-error: true
        run: |
          set -o pipefail
          python3 reference/eve-ai-studio-preview/build_standalone.py 2>&1 | tee eve-standalone-build.txt
          file=reference/eve-ai-studio-preview/EVE_AI_STUDIO_STANDALONE.html
          test -s "$file"
          ! grep -Eiq '<script[^>]+src=' "$file"
          ! grep -Eiq "<link[^>]+rel=['\"]stylesheet['\"]" "$file"

      - name: Interrompi se la build fallisce
        if: steps.build.outcome != 'success'
        run: exit 1

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Installa Playwright e Chromium
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium

      - name: Verifica file locale
        id: browser
        continue-on-error: true
        run: |
          cat > verify-eve-standalone.mjs <<'EOF'
          import { chromium } from "playwright";
          import assert from "node:assert/strict";
          import { pathToFileURL } from "node:url";
          import { resolve } from "node:path";
          import fs from "node:fs";

          const browser = await chromium.launch({ headless: true });
          const page = await browser.newPage({ viewport: { width: 1440, height: 2200 }, deviceScaleFactor: 2 });
          const errors = [];
          page.on("console", message => { if (message.type() === "error") errors.push(message.text()); });
          page.on("pageerror", error => errors.push(error.message));
          let quality = "unknown";
          let assets = 0;
          let galleryCards = 0;

          try {
            const file = resolve("reference/eve-ai-studio-preview/EVE_AI_STUDIO_STANDALONE.html");
            await page.goto(pathToFileURL(file).href, { waitUntil: "load" });
            await page.waitForFunction(
              () => window.EveAnimationLibrary?.setState && document.getElementById("sourceOpeningPanel") && document.getElementById("openAnimationLibraryBtn"),
              null,
              { timeout: 30000 }
            );

            assert.equal(await page.locator('meta[name="eve-preview-format"]').getAttribute("content"), "standalone");
            quality = await page.evaluate(() => window.EveAnimationLibrary.quality || "legacy-preview");

            if (quality === "original-final-webp") {
              assert.equal(await page.locator('meta[name="eve-animation-quality"]').getAttribute("content"), "original-hq");
              const states = await page.evaluate(() => window.EveAnimationLibrary.listStates());
              assets = states.length;
              assert.equal(assets, 64);
              for (const asset of states) {
                const result = await page.evaluate(async selected => {
                  await window.EveAnimationLibrary.setState(selected.id, { restart: true });
                  const image = document.getElementById("eveHqPortrait");
                  await image.decode().catch(() => {});
                  return { width: image.naturalWidth, height: image.naturalHeight, sha: image.dataset.eveSha256, quality: image.dataset.eveQuality };
                }, asset);
                assert.equal(result.width, asset.width);
                assert.equal(result.height, asset.height);
                assert.equal(result.sha, asset.sha256);
                assert.equal(result.quality, "original");
              }
            } else {
              throw new Error(`Qualità animazioni inattesa: ${quality}`);
            }

            await page.locator("#openAnimationLibraryBtn").click();
            await page.waitForFunction(() => document.querySelectorAll("#animationLibraryGrid .animation-card").length === 64);
            galleryCards = await page.locator("#animationLibraryGrid .animation-card").count();
            assert.equal(galleryCards, 64);
            assert.match(await page.locator("#animationLibraryCount").textContent(), /^64 animazioni$/);
            await page.locator('#animationLibraryGrid .animation-card[data-asset-id="eve-thinking-deep"]').click();
            await page.waitForFunction(() => document.getElementById("eveHqPortrait")?.dataset.eveState === "eve-thinking-deep");

            await page.locator('[data-view="rag-materials"]').click();
            await page.locator("#materialScenario").selectOption("valid");
            await page.locator("#runMaterialImport").click();
            await page.waitForFunction(() => !document.getElementById("runMaterialImport").disabled);
            assert.match(await page.locator("#materialImportHistory").textContent(), /ready/);
            await page.locator("#retrievalScenario").selectOption("normal");
            await page.locator("#retrievalScenario").dispatchEvent("change");
            await page.locator("#runRetrievalSearch").click();
            assert.match(await page.locator("#retrievalResults").textContent(), /Citazione verificata/);
            await page.locator("#ragChatScenario").selectOption("grounded");
            await page.locator("#ragChatScenario").dispatchEvent("change");
            await page.locator("#runRagChat").click();
            assert.match(await page.locator("#ragChatAnswer").textContent(), /\[1\]/);
            await page.locator("#sourceOpeningScenario").selectOption("verified");
            await page.locator("#sourceOpeningScenario").dispatchEvent("change");
            await page.locator("#openVerifiedSource").click();
            assert.match(await page.locator("#sourceOpeningResult").textContent(), /Integrità verificata/);
            assert.equal(await page.evaluate(() => document.documentElement.scrollWidth <= document.documentElement.clientWidth), true);
            assert.deepEqual(errors, []);
            await page.screenshot({ path: "eve-ai-studio-standalone.png", fullPage: true });
            fs.writeFileSync("eve-standalone-result.json", JSON.stringify({ passed: true, quality, assets, galleryCards }, null, 2));
          } finally {
            await browser.close();
          }
          EOF
          set -o pipefail
          node verify-eve-standalone.mjs 2>&1 | tee eve-standalone-browser.txt

      - name: Salva standalone e risultati
        if: always()
        run: |
          mkdir -p eve-ai-studio/checkpoints
          outcome="${{ steps.browser.outcome }}"
          passed=false; [ "$outcome" = success ] && passed=true
          quality=$(python3 -c 'import json,pathlib; p=pathlib.Path("eve-standalone-result.json"); print(json.loads(p.read_text()).get("quality","unknown") if p.exists() else "unknown")')
          assets=$(python3 -c 'import json,pathlib; p=pathlib.Path("eve-standalone-result.json"); print(json.loads(p.read_text()).get("assets",0) if p.exists() else 0)')
          gallery=$(python3 -c 'import json,pathlib; p=pathlib.Path("eve-standalone-result.json"); print(json.loads(p.read_text()).get("galleryCards",0) if p.exists() else 0)')
          size=$(wc -c < reference/eve-ai-studio-preview/EVE_AI_STUDIO_STANDALONE.html 2>/dev/null || echo 0)
          cat > eve-ai-studio/checkpoints/EVE_STANDALONE_PREVIEW_RESULT.json <<EOF
          {"tested_sha":"${{ github.sha }}","passed":$passed,"browser_outcome":"$outcome","opened_as":"file://","file":"reference/eve-ai-studio-preview/EVE_AI_STUDIO_STANDALONE.html","size_bytes":$size,"animation_library":"1.2.2","animation_quality":"$quality","animation_assets":$assets,"animation_gallery_cards":$gallery,"external_scripts":0,"external_stylesheets":0,"navigation_entry_count":1}
          EOF
          cp eve-standalone-build.txt eve-ai-studio/checkpoints/EVE_STANDALONE_BUILD_LOG.txt 2>/dev/null || true
          cp eve-standalone-browser.txt eve-ai-studio/checkpoints/EVE_STANDALONE_BROWSER_LOG.txt 2>/dev/null || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f reference/eve-ai-studio-preview/EVE_AI_STUDIO_STANDALONE.html eve-ai-studio/checkpoints/EVE_STANDALONE_*.json eve-ai-studio/checkpoints/EVE_STANDALONE_*.txt
          git commit -m "build: aggiorna preview standalone Eve [skip eve standalone]" || exit 0
          git pull --rebase origin eve-ai-studio
          git push origin HEAD:eve-ai-studio

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eve-ai-studio-standalone-preview
          path: |
            eve-ai-studio-standalone.png
            eve-standalone-build.txt
            eve-standalone-browser.txt
          if-no-files-found: warn
          retention-days: 14

      - name: Applica esito
        if: steps.browser.outcome != 'success'
        run: exit 1

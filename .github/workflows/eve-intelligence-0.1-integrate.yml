name: Eve INTELLIGENCE 0.1 integration

on:
  push:
    branches: [eve-ai-studio]
    paths:
      - ".github/workflows/eve-intelligence-0.1-integrate.yml"

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: eve-ai-studio
          fetch-depth: 0

      - name: Collega servizio preview e documentazione
        run: |
          python3 - <<'PY'
          from pathlib import Path

          main = Path("eve-ai-studio/app/main.py")
          source = main.read_text(encoding="utf-8")
          if "from .intelligence import" not in source:
              source = source.replace(
                  "from .materials import MaterialLimits, MaterialService, SqliteMaterialStore, create_material_router\n",
                  "from .intelligence import (\n"
                  "    ResearchCenterService,\n"
                  "    ResearchLimits,\n"
                  "    SqliteResearchStore,\n"
                  "    create_research_router,\n"
                  ")\n"
                  "from .materials import MaterialLimits, MaterialService, SqliteMaterialStore, create_material_router\n",
              )
          source = source.replace('SERVICE_VERSION = "1.1.0"', 'SERVICE_VERSION = "1.2.0"')
          marker = "source_opening = SourceOpeningService(\n    material_store,\n    limits=SourceOpeningLimits(\n        max_context_chars=settings.source_max_context_chars,\n    ),\n)\n"
          addition = marker + "research_store = SqliteResearchStore(settings.research_db_path)\nresearch_center = ResearchCenterService(\n    research_store,\n    limits=ResearchLimits(\n        max_projects_per_room=settings.research_max_projects_per_room,\n        max_queries_per_project=settings.research_max_queries_per_project,\n        max_sources_per_project=settings.research_max_sources_per_project,\n    ),\n)\n"
          if "research_center = ResearchCenterService" not in source:
              if marker not in source:
                  raise RuntimeError("Punto di collegamento SourceOpeningService non trovato")
              source = source.replace(marker, addition)
          if "app.include_router(create_research_router(research_center))" not in source:
              source = source.replace(
                  "app.include_router(create_source_router(source_opening))\n",
                  "app.include_router(create_source_router(source_opening))\n"
                  "app.include_router(create_research_router(research_center))\n",
              )
          source = source.replace(
              '"apertura verificabile delle fonti. Provider esterni, embedding e database "\n        "vettoriali restano disattivati."',
              '"apertura verificabile delle fonti e centro ricerca INTELLIGENCE con "\n        "progetti, query e fonti in quarantena. Rete, acquisizione web, embedding e "\n        "addestramento del modello restano disattivati."',
          )
          main.write_text(source, encoding="utf-8")

          index = Path("reference/eve-ai-studio-preview/index.html")
          html = index.read_text(encoding="utf-8")
          html = html.replace(
              "Checkpoint 1.1 · Eve Animation Library 1.2.2 · 64 asset",
              "INTELLIGENCE-0.1 · Eve Animation Library 1.2.2 · 64 asset",
          )
          if 'loadPreviewScript("research-center-workflow.js")' not in html:
              html = html.replace(
                  '  await loadPreviewScript("source-opening-workflow.js");\n',
                  '  await loadPreviewScript("source-opening-workflow.js");\n'
                  '  await loadPreviewScript("research-center-workflow.js");\n',
              )
          index.write_text(html, encoding="utf-8")

          workflow = Path(".github/workflows/eve-ai-studio-checks.yml")
          checks = workflow.read_text(encoding="utf-8")
          if "research-center-workflow.js" not in checks:
              checks = checks.replace(
                  "            reference/eve-ai-studio-preview/source-opening-workflow.js\n",
                  "            reference/eve-ai-studio-preview/source-opening-workflow.js\n"
                  "            reference/eve-ai-studio-preview/research-center-workflow.js\n",
              )
          workflow.write_text(checks, encoding="utf-8")

          checkpoints = Path("eve-ai-studio/checkpoints")
          checkpoints.mkdir(parents=True, exist_ok=True)
          (checkpoints / "CHECKPOINT_CORE_1.1_APERTURA_FONTI_VERIFICA_INTEGRITA_CLOSURE.md").write_text(
              """# CORE-1.1 — Chiusura definitiva: apertura fonti e verifica integrità

Data: 28 luglio 2026  
Branch: `eve-ai-studio`

## Esito

Il checkpoint è **chiuso e approvato** dall'utente.

Sono confermati:

- apertura delle citazioni tramite locator rigido;
- isolamento per aula;
- verifica delle coordinate e dello SHA-256;
- controllo contro il testo estratto;
- gestione delle versioni storiche;
- fonti sospette trattate come dati non fidati;
- `instructions_executable=false`;
- suite cumulativa CORE con 165 test superati;
- preview e standalone HQ verificati.

La linea CORE resta in pausa. Nessun `CORE-1.2` è stato definito.
""",
              encoding="utf-8",
          )
          (checkpoints / "CHECKPOINT_INTELLIGENCE_0.1_CENTRO_RICERCA_PROGETTI_APPRENDIMENTO_PLAN.md").write_text(
              """# INTELLIGENCE-0.1 — Piano: centro ricerca e progetti di apprendimento

Data di avvio: 28 luglio 2026  
Branch: `eve-ai-studio`  
Approvazione: concessa preventivamente dall'utente per l'avanzamento senza pause intermedie.

## Obiettivo

Creare il centro di controllo dal quale Eve potrà organizzare ciò che dovrà studiare prima di collegare la ricerca online.

## Incluso

- progetti persistenti e isolati per `room_id`;
- obiettivo, dominio, lingua, livelli e argomenti;
- stati `draft`, `active`, `paused`, `completed`, `archived`;
- query pianificate e mai eseguite in questo checkpoint;
- catalogo manuale di URL e metadati;
- quarantena predefinita delle fonti;
- revisione umana predefinita;
- limiti configurabili;
- API dedicate;
- sezione ufficiale nella preview e nello standalone;
- test di persistenza, sicurezza, isolamento e contratti HTTP.

## Escluso

- ricerca web reale;
- download o apertura automatica degli URL;
- estrazione del contenuto online;
- approvazione automatica delle fonti;
- embedding e database vettoriale;
- provider AI reale;
- modifica o addestramento dei pesi del modello.

## Criteri di completamento

1. database SQLite separato;
2. API sotto `/v1/intelligence/research`;
3. nessuna funzione di rete nel modulo;
4. fonti sempre `quarantined` e `content_acquired=false`;
5. isolamento tra aule verificato;
6. almeno 15 test specifici;
7. preview modulare e standalone funzionanti;
8. documentazione e rapporto CI ricercabili tramite parole chiave.
""",
              encoding="utf-8",
          )
          (checkpoints / "CHECKPOINT_INTELLIGENCE_0.1_CENTRO_RICERCA_PROGETTI_APPRENDIMENTO_UPDATE.txt").write_text(
              """EVE AI STUDIO — INTELLIGENCE-0.1
CENTRO RICERCA E PROGETTI DI APPRENDIMENTO

STATO
Implementazione avviata e collegata al servizio 1.2.0.

COMPONENTI
- app/intelligence/models.py
- app/intelligence/errors.py
- app/intelligence/storage.py
- app/intelligence/service.py
- app/intelligence/router.py
- app/intelligence/__init__.py
- tests/test_intelligence_research.py
- reference/eve-ai-studio-preview/research-center-workflow.js

SICUREZZA
- web_search_enabled=false
- content_acquisition_enabled=false
- model_training_enabled=false
- human_review_required=true
- fonti candidate in quarantena
- isolamento per room_id

PROSSIMO CHECKPOINT
INTELLIGENCE-0.2_ACQUISIZIONE_WEB_CONTROLLATA_QUARANTENA_FONTI
""",
              encoding="utf-8",
          )

          phase = Path("eve-ai-studio/PHASE_STATUS.md")
          phase_text = phase.read_text(encoding="utf-8")
          phase_text = phase_text.replace(
              "Versione servizio CORE: 1.1.0\nLinea CORE: in pausa dopo CORE-1.1\nLinea INTELLIGENCE: pianificata, non ancora iniziata",
              "Versione servizio: 1.2.0\nLinea CORE: chiusa e in pausa dopo CORE-1.1\nLinea INTELLIGENCE: INTELLIGENCE-0.1 in implementazione e verifica",
          )
          phase_text = phase_text.replace(
              "Stato: **tecnicamente completo; chiusura utente da registrare**",
              "Stato: **chiuso e approvato**",
              1,
          )
          phase_text = phase_text.replace(
              "### `INTELLIGENCE-0.1` — Centro ricerca e progetti di apprendimento\n\nStato: **pianificato**",
              "### `INTELLIGENCE-0.1` — Centro ricerca e progetti di apprendimento\n\nStato: **implementato; verifica automatica in corso**",
          )
          phase.write_text(phase_text, encoding="utf-8")

          checkpoint_index = Path("eve-ai-studio/CHECKPOINT_INDEX.md")
          index_text = checkpoint_index.read_text(encoding="utf-8")
          index_text = index_text.replace(
              "La linea `CORE` è attualmente **in pausa dopo CORE-1.1**. La linea `INTELLIGENCE` è **pianificata ma non ancora iniziata**.",
              "La linea `CORE` è **chiusa e in pausa dopo CORE-1.1**. La linea `INTELLIGENCE` è attiva su **INTELLIGENCE-0.1**.",
          )
          index_text = index_text.replace(
              "| `CORE-1.1` | Apertura fonti, verifica integrità | tecnicamente completo; chiusura utente da registrare |",
              "| `CORE-1.1` | Apertura fonti, verifica integrità | chiuso e approvato |",
          )
          index_text = index_text.replace(
              "| `INTELLIGENCE-0.1` | Centro ricerca, progetti apprendimento | creare ricerche, obiettivi, query, avanzamento e catalogo fonti |",
              "| `INTELLIGENCE-0.1` | Centro ricerca, progetti apprendimento | implementato; verifica automatica in corso |",
          )
          checkpoint_index.write_text(index_text, encoding="utf-8")

          readme = Path("eve-ai-studio/README.md")
          readme_text = readme.read_text(encoding="utf-8")
          readme_text = readme_text.replace(
              "La linea `CORE` è attualmente **in pausa dopo CORE-1.1**. La linea `INTELLIGENCE` è **pianificata ma non ancora iniziata**.",
              "La linea `CORE` è chiusa e in pausa dopo `CORE-1.1`. La linea `INTELLIGENCE` è attiva su `INTELLIGENCE-0.1`.",
          )
          readme_text = readme_text.replace("Versione: 1.1.0", "Versione: 1.2.0")
          readme_text = readme_text.replace(
              "| `CORE-1.1` | Apertura fonti, verifica integrità | tecnicamente completo; chiusura utente da registrare |",
              "| `CORE-1.1` | Apertura fonti, verifica integrità | chiuso e approvato |",
          )
          readme_text = readme_text.replace(
              "| `INTELLIGENCE-0.1` | Centro ricerca, progetti apprendimento | pianificato |",
              "| `INTELLIGENCE-0.1` | Centro ricerca, progetti apprendimento | implementato; verifica in corso |",
          )
          readme.write_text(readme_text, encoding="utf-8")
          PY

          python3 reference/eve-ai-studio-preview/build_standalone.py
          rm -f .github/workflows/eve-intelligence-0.1-integrate.yml

      - name: Salva integrazione
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat(intelligence-0.1): integra centro ricerca e chiude CORE-1.1"
          git pull --rebase origin eve-ai-studio
          git push origin HEAD:eve-ai-studio

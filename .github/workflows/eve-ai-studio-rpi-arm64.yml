name: Eve AI Studio - Raspberry Pi ARM64

on:
  workflow_dispatch:
  push:
    branches:
      - eve-ai-studio-rpi-arm64
    paths:
      - "eve-desktop/**"
      - "reference/eve-ai-studio-preview/**"
      - ".github/workflows/eve-ai-studio-rpi-arm64.yml"

permissions:
  contents: read

jobs:
  build-arm64:
    runs-on: ubuntu-22.04-arm
    timeout-minutes: 45

    defaults:
      run:
        working-directory: eve-desktop

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config curl wget file patchelf \
            libssl-dev libgtk-3-dev libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev librsvg2-dev libxdo-dev

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@9 --activate
          pnpm --version

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install JS dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Raspberry Pi bundles
        run: pnpm tauri build --config src-tauri/tauri.rpi.conf.json --bundles deb,appimage

      - name: Show bundles
        run: find src-tauri/target/release/bundle -maxdepth 3 -type f -print

      - name: Upload Raspberry Pi installers
        uses: actions/upload-artifact@v4
        with:
          name: Eve-AI-Studio-RaspberryPi-ARM64
          if-no-files-found: error
          path: |
            eve-desktop/src-tauri/target/release/bundle/deb/*.deb
            eve-desktop/src-tauri/target/release/bundle/appimage/*.AppImage
          retention-days: 30

name: Riattiva Fase 3 alpha.10

on:
  push:
    branches: [demo-canonica]
    paths:
      - .github/workflows/apply-phase3-alpha10-retry.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: demo-canonica-phase3-alpha10-retry
  cancel-in-progress: false

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: demo-canonica
          fetch-depth: 0

      - name: Configura e verifica baseline
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --ff-only origin demo-canonica
          python -m py_compile scripts/apply-phase3-alpha10-clean.py
          python - <<'PY'
          from pathlib import Path
          import hashlib
          current = Path('reference/demo-aula-studio-virtuale-canonica.html').read_bytes()
          previous = Path('reference/checkpoints/phase-3/demo-aula-studio-virtuale-1.3.0-alpha.9.html').read_bytes()
          assert current == previous
          assert len(current) == 727961
          assert current.count(b'\n') + 1 == 19865
          assert hashlib.sha256(current).hexdigest() == '957ae6c18adf653dbcfa7bafeab33e57fb49a87a210717584a555b9abb534318'
          PY

      - name: Applica consolidamento
        run: python scripts/apply-phase3-alpha10-clean.py

      - name: Verifica risultato
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import hashlib
          import re
          canonical = Path('reference/demo-aula-studio-virtuale-canonica.html')
          checkpoint = Path('reference/checkpoints/phase-3/demo-aula-studio-virtuale-1.3.0-alpha.10.html')
          report = Path('reference/checkpoints/phase-3/VERIFICATION-1.3.0-alpha.10.md')
          data = canonical.read_bytes()
          html = data.decode('utf-8')
          assert checkpoint.read_bytes() == data
          assert report.exists()
          for marker in [
              'MATERIALI E WORKSPACE — CONSOLIDAMENTO 1.3.0-alpha.10',
              'function aulaTextOpen(material)',
              'function aulaMaterialDiagnosticsRun()',
              'function aulaMaterialDiagnosticsOpen()',
              'function aulaMaterialDiagnosticsReset()',
              'MATERIALI E WORKSPACE — ERRORI E ALTERNATIVE 1.3.0-alpha.9',
              'MATERIALI E WORKSPACE — TRACKING E RIPRESA 1.3.0-alpha.8',
              'MATERIALI E WORKSPACE — IMPORT REQUIRED 1.3.0-alpha.7',
              'MATERIALI E WORKSPACE — VIDEO 1.3.0-alpha.6',
              'MATERIALI E WORKSPACE — DOCX E PPTX 1.3.0-alpha.5',
              'MATERIALI E WORKSPACE — VIEWER PDF 1.3.0-alpha.4',
              'MATERIALI E WORKSPACE — TIPI E CLASSIFICAZIONE 1.3.0-alpha.3',
              'MATERIALI E WORKSPACE — UPLOAD E LINK 1.3.0-alpha.2',
          ]:
              assert marker in html, marker
          ids = [v for v in re.findall(r'\bid=["\']([^"\']+)["\']', html) if '${' not in v]
          duplicates = sorted({v for v in ids if ids.count(v) > 1})
          assert not duplicates, duplicates
          assert html.count('<script') == html.count('</script>')
          assert html.count('<style') == html.count('</style>')
          assert html.rstrip().endswith('</html>')
          readme = Path('reference/README.md').read_text(encoding='utf-8')
          size = int(re.search(r'- dimensione: `(\d+)` byte', readme).group(1))
          lines = int(re.search(r'- righe: `(\d+)`', readme).group(1))
          sha = re.search(r'- SHA-256: `([0-9a-f]{64})`', readme).group(1)
          blob = re.search(r'- Git blob SHA: `([0-9a-f]{40})`', readme).group(1)
          assert len(data) == size
          assert data.count(b'\n') + 1 == lines
          assert hashlib.sha256(data).hexdigest() == sha
          assert hashlib.sha1(f'blob {len(data)}\0'.encode() + data).hexdigest() == blob
          print(size, lines, sha, blob)
          PY
          rm -rf /tmp/phase3-alpha10-js
          mkdir -p /tmp/phase3-alpha10-js
          python - <<'PY'
          from pathlib import Path
          import re
          html = Path('reference/demo-aula-studio-virtuale-canonica.html').read_text(encoding='utf-8')
          count = 0
          for attrs, body in re.findall(r'<script([^>]*)>(.*?)</script>', html, flags=re.I | re.S):
              match = re.search(r'type=["\']([^"\']+)', attrs, flags=re.I)
              kind = match.group(1).lower() if match else ''
              if kind and kind not in {'text/javascript', 'application/javascript'}:
                  continue
              if 'src=' in attrs.lower() or not body.strip():
                  continue
              Path(f'/tmp/phase3-alpha10-js/script-{count}.js').write_text(body, encoding='utf-8')
              count += 1
          assert count > 0
          PY
          for file in /tmp/phase3-alpha10-js/*.js; do node --check "$file"; done

      - name: Commit finale pulito
        shell: bash
        run: |
          set -euo pipefail
          rm -rf scripts/__pycache__
          rm -f scripts/apply-phase3-alpha10-clean.py
          rm -f .github/workflows/apply-phase3-alpha10-clean.yml
          rm -f .github/workflows/apply-phase3-alpha10-retry.yml
          git add -A
          git diff --cached --quiet && exit 1
          git commit -m "[phase3][materials-consolidation] Finalizza checkpoint 1.3.0-alpha.10"
          git push origin HEAD:demo-canonica
          git fetch origin demo-canonica
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/demo-canonica)"

name: Applica Fase 3 alpha.8 pulita

on:
  push:
    branches:
      - demo-canonica
    paths:
      - .github/workflows/apply-phase3-alpha8-clean.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: demo-canonica-phase3-alpha8-clean
  cancel-in-progress: false

jobs:
  apply-alpha-8:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout demo-canonica
        uses: actions/checkout@v4
        with:
          ref: demo-canonica
          fetch-depth: 0

      - name: Verifica baseline alpha.7
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --ff-only origin demo-canonica
          python -m py_compile scripts/apply-phase3-alpha8-clean.py
          python - <<'PY'
          from pathlib import Path
          import hashlib

          canonical = Path('reference/demo-aula-studio-virtuale-canonica.html')
          alpha7 = Path('reference/checkpoints/phase-3/demo-aula-studio-virtuale-1.3.0-alpha.7.html')
          current = canonical.read_bytes()
          checkpoint = alpha7.read_bytes()
          assert current == checkpoint, 'Il canonico non coincide con alpha.7'
          assert len(current) == 699358
          assert current.count(b'\n') + 1 == 19340
          assert hashlib.sha256(current).hexdigest() == 'dcd007394aece2c5dde6a134fd7744e5d38ca422d83062ad59664920970cafdb'
          print('Baseline alpha.7 verificata')
          PY

      - name: Applica alpha.8
        shell: bash
        run: |
          set -euo pipefail
          python scripts/apply-phase3-alpha8-clean.py | tee /tmp/phase3-alpha8-result.txt

      - name: Verifica HTML e tracking
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import hashlib
          import re

          canonical = Path('reference/demo-aula-studio-virtuale-canonica.html')
          checkpoint = Path('reference/checkpoints/phase-3/demo-aula-studio-virtuale-1.3.0-alpha.8.html')
          html = canonical.read_text(encoding='utf-8')
          data = canonical.read_bytes()
          required = [
              'MATERIALI E WORKSPACE — TRACKING E RIPRESA 1.3.0-alpha.8',
              'aula-demo-material-progress-v2',
              'function aulaMaterialProgressAll()',
              'function aulaMaterialPosition()',
              'function aulaMaterialTrackingSave(eventType = null)',
              'function aulaMaterialTrackingStart(id, saved)',
              'function aulaMaterialTrackingBanner(id, saved)',
              'function aulaMaterialRestoreAfterOpen(id, saved)',
              'material_resumed',
              'position_changed',
              'Salvataggio ogni 5 secondi attivi',
              'MATERIALI E WORKSPACE — IMPORT REQUIRED 1.3.0-alpha.7',
              'MATERIALI E WORKSPACE — VIDEO 1.3.0-alpha.6',
              'MATERIALI E WORKSPACE — DOCX E PPTX 1.3.0-alpha.5',
              'MATERIALI E WORKSPACE — VIEWER PDF 1.3.0-alpha.4',
          ]
          for marker in required:
              assert marker in html, f'Marker assente: {marker}'
          assert checkpoint.exists(), 'Checkpoint alpha.8 assente'
          assert checkpoint.read_bytes() == data, 'Checkpoint alpha.8 diverso dal canonico'
          ids = [value for value in re.findall(r'\bid=["\']([^"\']+)["\']', html) if '${' not in value]
          duplicates = sorted({value for value in ids if ids.count(value) > 1})
          assert not duplicates, f'ID duplicati: {duplicates}'
          assert html.count('<script') == html.count('</script>'), 'Tag script sbilanciati'
          assert html.count('<style') == html.count('</style>'), 'Tag style sbilanciati'
          assert html.rstrip().endswith('</html>'), 'Chiusura HTML assente'
          readme = Path('reference/README.md').read_text(encoding='utf-8')
          expected_size = int(re.search(r'- dimensione: `(\d+)` byte', readme).group(1))
          expected_lines = int(re.search(r'- righe: `(\d+)`', readme).group(1))
          expected_sha = re.search(r'- SHA-256: `([0-9a-f]{64})`', readme).group(1)
          assert len(data) == expected_size
          assert data.count(b'\n') + 1 == expected_lines
          assert hashlib.sha256(data).hexdigest() == expected_sha
          assert '1.3.0-alpha.8' in readme
          assert '1.3.0-alpha.8' in Path('reference/checkpoints/phase-3/README.md').read_text(encoding='utf-8')
          print(f'HTML alpha.8 verificato: {expected_size} byte, {expected_lines} righe, {expected_sha}')
          PY

      - name: Verifica JavaScript inline
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/phase3-alpha8-js
          mkdir -p /tmp/phase3-alpha8-js
          python - <<'PY'
          from pathlib import Path
          import re

          html = Path('reference/demo-aula-studio-virtuale-canonica.html').read_text(encoding='utf-8')
          scripts = re.findall(r'<script([^>]*)>(.*?)</script>', html, flags=re.I | re.S)
          output = Path('/tmp/phase3-alpha8-js')
          count = 0
          for attrs, body in scripts:
              type_match = re.search(r'type=["\']([^"\']+)', attrs, flags=re.I)
              script_type = type_match.group(1).lower() if type_match else ''
              if script_type and script_type not in {'text/javascript', 'application/javascript'}:
                  continue
              if 'src=' in attrs.lower() or not body.strip():
                  continue
              (output / f'script-{count}.js').write_text(body, encoding='utf-8')
              count += 1
          assert count > 0, 'Nessuno script classico estratto'
          print(f'Script estratti: {count}')
          PY
          for file in /tmp/phase3-alpha8-js/*.js; do
            node --check "$file"
          done

      - name: Commit finale alpha.8
        shell: bash
        run: |
          set -euo pipefail
          rm -rf scripts/__pycache__
          rm -f scripts/apply-phase3-alpha8-clean.py
          rm -f .github/workflows/apply-phase3-alpha8-clean.yml
          git add -A
          git diff --cached --quiet && { echo 'Alpha.8 non ha prodotto modifiche'; exit 1; }
          git commit -m "[phase3][materials-tracking] Finalizza checkpoint 1.3.0-alpha.8"
          git push origin HEAD:demo-canonica
          git fetch origin demo-canonica
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/demo-canonica)"

      - name: Pubblica demo alpha.8
        uses: actions/upload-artifact@v4
        with:
          name: demo-aula-studio-virtuale-1.3.0-alpha.8
          path: |
            reference/checkpoints/phase-3/demo-aula-studio-virtuale-1.3.0-alpha.8.html
            reference/checkpoints/phase-3/README.md
          if-no-files-found: error
          retention-days: 30

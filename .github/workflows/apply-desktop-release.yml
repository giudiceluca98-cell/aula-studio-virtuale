name: Applica rilascio desktop

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Scarica il repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Applica il commit verificato
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c release/desktop-1.4.0-alpha.2
          git am .github/transfer/0001-feat-aggiunge-app-desktop-e-build-modulare.patch
          git rm .github/transfer/0001-feat-aggiunge-app-desktop-e-build-modulare.patch
          git rm .github/workflows/apply-desktop-release.yml
          git commit -m "chore: rimuove trasferimento temporaneo"
          git push origin release/desktop-1.4.0-alpha.2

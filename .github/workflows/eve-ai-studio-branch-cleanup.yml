name: Eve AI Studio branch cleanup

on:
  push:
    branches:
      - eve-ai-studio
    paths:
      - ".github/workflows/eve-ai-studio-branch-cleanup.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: eve-ai-studio
          fetch-depth: 0

      - name: Fetch branches
        run: git fetch origin '+refs/heads/*:refs/remotes/origin/*'

      - name: Verifica ed elimina branch obsoleti
        run: |
          set -euo pipefail
          protected=(main demo-canonica eve-ai-studio eve-canonical-integration-v2)
          merged=(eve-canonical-integration integration/eve-1.2.2-canonical)
          temporary=(eve-ai-studio-cleanup-audit)
          deleted=()

          is_protected() {
            local candidate="$1"
            for item in "${protected[@]}"; do
              [ "$candidate" = "$item" ] && return 0
            done
            return 1
          }

          for branch in "${merged[@]}"; do
            is_protected "$branch" && { echo "Branch protetto: $branch"; exit 1; }
            if git show-ref --verify --quiet "refs/remotes/origin/$branch"; then
              git merge-base --is-ancestor "origin/$branch" origin/eve-ai-studio
              git push origin --delete "$branch"
              deleted+=("$branch")
            fi
          done

          for branch in "${temporary[@]}"; do
            is_protected "$branch" && { echo "Branch protetto: $branch"; exit 1; }
            if git show-ref --verify --quiet "refs/remotes/origin/$branch"; then
              git push origin --delete "$branch"
              deleted+=("$branch")
            fi
          done

          python3 - "${deleted[@]}" <<'PY'
          import json, sys
          from datetime import datetime, timezone
          from pathlib import Path
          Path('eve-ai-studio/checkpoints/EVE_BRANCH_CLEANUP_RESULT.json').write_text(
              json.dumps({
                  'passed': True,
                  'deleted_branches': sys.argv[1:],
                  'protected_branches_preserved': ['main','demo-canonica','eve-ai-studio','eve-canonical-integration-v2'],
                  'completed_at': datetime.now(timezone.utc).isoformat(),
              }, ensure_ascii=False, indent=2),
              encoding='utf-8'
          )
          PY

      - name: Registra risultato e rimuove il workflow temporaneo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/eve-ai-studio-branch-cleanup.yml
          git add eve-ai-studio/checkpoints/EVE_BRANCH_CLEANUP_RESULT.json
          git commit -m "chore: completa pulizia branch Eve AI Studio"
          git pull --rebase origin eve-ai-studio
          git push origin HEAD:eve-ai-studio

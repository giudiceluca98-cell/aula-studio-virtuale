name: Applica checkpoint Catalogo demo

on:
  push:
    branches:
      - demo-canonica
    paths:
      - .github/workflows/apply-demo-catalog-checkpoint.yml
      - scripts/apply-demo-catalog-checkpoint.py
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: demo-canonica-catalog-checkpoint
  cancel-in-progress: false

jobs:
  apply-catalog:
    if: ${{ !contains(github.event.head_commit.message || '', '[catalog-checkpoint]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout demo-canonica
        uses: actions/checkout@v4
        with:
          ref: demo-canonica
          fetch-depth: 0

      - name: Correggi il validatore dello script
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('scripts/apply-demo-catalog-checkpoint.py')
          text = path.read_text(encoding='utf-8')
          old = '''    ids = re.findall(r'\\bid=["\\']([^"\\']+)["\\']', html)
              duplicates = sorted({value for value in ids if ids.count(value) > 1})'''.replace('              duplicates', '    duplicates')
          new = '''    ids = [
                  value
                  for value in re.findall(r'\\bid=["\\']([^"\\']+)["\\']', html)
                  if '${' not in value
              ]
              duplicates = sorted({value for value in ids if ids.count(value) > 1})'''.replace('                  value', '        value').replace('                  for', '        for').replace('                  if', '        if').replace('              ]', '    ]').replace('              duplicates', '    duplicates')
          if old not in text:
              raise SystemExit('Blocco del validatore non trovato')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Applica il Catalogo alla demo
        run: python scripts/apply-demo-catalog-checkpoint.py

      - name: Correggi la navigazione mobile del Catalogo e gli identificatori
        shell: bash
        run: |
          python - <<'PY'
          from __future__ import annotations
          import hashlib
          import re
          from pathlib import Path

          html_path = Path('reference/demo-aula-studio-virtuale-canonica.html')
          readme_path = Path('reference/README.md')
          changelog_path = Path('reference/CHANGELOG_DEMO.md')
          html = html_path.read_text(encoding='utf-8')

          html = html.replace(
              '<button class="portal-button" type="button" onclick="navigatePortal(\'dashboard\')">← Scrivania</button>',
              '<button class="portal-button catalog-demo-back-button" type="button" onclick="navigatePortal(\'dashboard\')">← Scrivania</button>',
              1,
          )
          html = html.replace(
              '<button class="portal-button" type="button" onclick="toggleDarkMode()">Tema</button>\n          <span class="portal-status">✦ Eve · percorso locale</span>',
              '<button class="portal-button catalog-demo-theme-button" type="button" onclick="toggleDarkMode()">Tema</button>\n          <span class="portal-status">✦ Eve · percorso locale</span>',
              1,
          )

          mobile_anchor = '''      .catalog-demo-hero h1 {
                  font-size: clamp(38px, 13vw, 60px);
                }
              }
          '''.replace('              font-size', '        font-size').replace('            }', '      }').replace('          }', '    }')
          mobile_replacement = '''      .catalog-demo-hero h1 {
                  font-size: clamp(38px, 13vw, 60px);
                }

                .catalog-demo-view .portal-navbar {
                  min-height: 62px;
                }

                .catalog-demo-view .portal-nav {
                  gap: 4px;
                }

                .catalog-demo-view .portal-nav .catalog-demo-back-button {
                  min-height: 38px;
                  display: inline-flex !important;
                  padding: 0 10px;
                }

                .catalog-demo-view .portal-nav .catalog-demo-theme-button,
                .catalog-demo-view .portal-status {
                  display: none !important;
                }
              }
          '''
          for spaces in (18, 16, 14, 12, 10, 8, 6, 4):
              mobile_replacement = mobile_replacement.replace(' ' * spaces, ' ' * max(0, spaces - 10))
          if mobile_anchor not in html:
              raise SystemExit('Blocco responsive Catalogo non trovato')
          html = html.replace(mobile_anchor, mobile_replacement, 1)
          html_path.write_text(html, encoding='utf-8')

          data = html.encode('utf-8')
          size = len(data)
          lines = html.count('\n') + 1
          sha256 = hashlib.sha256(data).hexdigest()
          blob = hashlib.sha1(f'blob {size}\0'.encode() + data).hexdigest()

          readme = readme_path.read_text(encoding='utf-8')
          readme = re.sub(r'- dimensione: `\d+` byte', f'- dimensione: `{size}` byte', readme, count=1)
          readme = re.sub(r'- righe: `\d+`', f'- righe: `{lines}`', readme, count=1)
          readme = re.sub(r'- SHA-256: `[0-9a-f]+`', f'- SHA-256: `{sha256}`', readme, count=1)
          readme = re.sub(r'- Git blob SHA: `[0-9a-f]+`', f'- Git blob SHA: `{blob}`', readme, count=1)
          readme_path.write_text(readme, encoding='utf-8')

          changelog = changelog_path.read_text(encoding='utf-8')
          section_start = changelog.find('## [1.1.0-alpha.1]')
          section_end = changelog.find('\n---', section_start)
          if section_start >= 0 and section_end > section_start:
              section = changelog[section_start:section_end]
              section = re.sub(r'- Dimensione: `\d+` byte', f'- Dimensione: `{size}` byte', section, count=1)
              section = re.sub(r'- Righe: `\d+`', f'- Righe: `{lines}`', section, count=1)
              section = re.sub(r'- SHA-256: `[0-9a-f]+`', f'- SHA-256: `{sha256}`', section, count=1)
              section = re.sub(r'- Git blob SHA: `[0-9a-f]+`', f'- Git blob SHA: `{blob}`', section, count=1)
              if 'navigazione mobile' not in section:
                  section = section.replace(
                      '- Aggiunti responsive mobile, focus nativo e rispetto di `prefers-reduced-motion`.',
                      '- Aggiunti responsive mobile, pulsante Scrivania sempre visibile, focus nativo e rispetto di `prefers-reduced-motion`.',
                  )
              changelog = changelog[:section_start] + section + changelog[section_end:]
              changelog_path.write_text(changelog, encoding='utf-8')

          print(f'bytes={size}')
          print(f'lines={lines}')
          print(f'sha256={sha256}')
          print(f'git_blob_sha={blob}')
          PY

      - name: Verifiche statiche
        shell: bash
        run: |
          python - <<'PY'
          import re
          from pathlib import Path
          html = Path('reference/demo-aula-studio-virtuale-canonica.html').read_text(encoding='utf-8')
          required = [
              'id="portalCatalog"',
              'function catalogDemoRender(',
              'function catalogDemoImportPath(',
              'catalog: document.getElementById("portalCatalog")',
              'catalog-demo-back-button',
          ]
          for marker in required:
              assert marker in html, marker
          ids = [value for value in re.findall(r'\bid=["\']([^"\']+)["\']', html) if '${' not in value]
          duplicates = sorted({value for value in ids if ids.count(value) > 1})
          assert not duplicates, duplicates
          assert html.count('<script') == html.count('</script>')
          assert html.count('<style') == html.count('</style>')
          assert html.rstrip().endswith('</html>')
          print('Controlli statici superati')
          PY

      - name: Pubblica HTML come artefatto
        uses: actions/upload-artifact@v4
        with:
          name: demo-canonica-catalogo-1.1.0-alpha.1
          path: reference/demo-aula-studio-virtuale-canonica.html
          if-no-files-found: error
          retention-days: 30

      - name: Commit sul solo branch demo-canonica
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reference scripts/apply-demo-catalog-checkpoint.py
          if git diff --cached --quiet; then
            echo "Nessuna modifica da registrare"
            exit 0
          fi
          git commit -m "[catalog-checkpoint] Integra il Catalogo nella demo canonica"
          git push origin HEAD:demo-canonica

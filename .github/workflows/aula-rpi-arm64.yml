name: Aula Studio Virtuale - Raspberry Pi ARM64 DEV

on:
  workflow_dispatch:
  push:
    branches:
      - raspberry-pi-arm64
    paths:
      - "src-tauri/**"
      - "desktop/**"
      - "tools/**"
      - "assets/**"
      - "**/*.html"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "scripts/build-rpi-arm64.sh"
      - ".github/workflows/aula-rpi-arm64.yml"

permissions:
  contents: read

jobs:
  build-arm64-dev:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config curl wget file patchelf \
            libssl-dev libgtk-3-dev libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev librsvg2-dev libxdo-dev

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup pnpm 10
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install JS dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build Raspberry Pi DEV bundles
        run: |
          pnpm build:desktop
          pnpm tauri build --config src-tauri/tauri.rpi.conf.json --bundles deb,appimage

      - name: Show bundles
        run: find src-tauri/target/release/bundle -maxdepth 3 -type f -print

      - name: Upload Raspberry Pi DEV artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Aula-Studio-Virtuale-RaspberryPi-ARM64-DEV-NO-UPDATER
          if-no-files-found: error
          path: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/appimage/*.AppImage
          retention-days: 30

      - name: Explain release path
        run: |
          echo "Questi artifact sono solo DEV e non includono la configurazione updater firmata."
          echo "Le build installabili/auto-aggiornabili vengono pubblicate da release-desktop.yml."

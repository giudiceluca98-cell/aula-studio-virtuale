name: Eve AI Studio core cleanup verification

on:
  push:
    branches:
      - eve-ai-studio
    paths:
      - ".github/workflows/eve-ai-studio-core-cleanup-verification.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: eve-ai-studio
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Installa e verifica core
        id: core
        continue-on-error: true
        run: |
          set -o pipefail
          : > eve-core-cleanup.log
          python -m pip install --upgrade pip 2>&1 | tee -a eve-core-cleanup.log
          python -m pip install -e "eve-ai-studio[dev]" 2>&1 | tee -a eve-core-cleanup.log
          cd eve-ai-studio
          python -m compileall -q app tests 2>&1 | tee -a ../eve-core-cleanup.log
          python -m pytest -q --junitxml=pytest-results.xml 2>&1 | tee -a ../eve-core-cleanup.log
          cd ..
          files=(
            reference/eve-ai-studio-preview/checkpoint-04-patch.js
            reference/eve-ai-studio-preview/prompt-compat.js
            reference/eve-ai-studio-preview/app.js
            reference/eve-ai-studio-preview/prompt-workflow.js
            reference/eve-ai-studio-preview/evaluation-workflow.js
            reference/eve-ai-studio-preview/runner-workflow.js
            reference/eve-ai-studio-preview/provider-workflow.js
            reference/eve-ai-studio-preview/materials-workflow.js
            reference/eve-ai-studio-preview/retrieval-workflow.js
            reference/eve-ai-studio-preview/rag-chat-workflow.js
            reference/eve-ai-studio-preview/source-opening-workflow.js
            reference/eve-ai-studio-preview/navigation-compat.js
            reference/eve-ai-studio-preview/animation-library-gallery.js
            reference/eve-ai-studio-preview/eve-animation-runtime-v1.2.2/eve-hq-runtime.js
          )
          for file in "${files[@]}"; do
            test -f "$file"
            echo "node --check $file" | tee -a eve-core-cleanup.log
            node --check "$file" 2>&1 | tee -a eve-core-cleanup.log
          done

      - name: Scrive sempre il rapporto e si rimuove
        if: always()
        env:
          CORE_OUTCOME: ${{ steps.core.outcome }}
        run: |
          python3 - <<'PY'
          import json, os
          import xml.etree.ElementTree as ET
          from datetime import datetime, timezone
          from pathlib import Path

          counts = {'tests': 0, 'failures': 0, 'errors': 0, 'skipped': 0}
          junit = Path('eve-ai-studio/pytest-results.xml')
          if junit.exists():
              root = ET.parse(junit).getroot()
              suites = list(root) if root.tag == 'testsuites' else [root]
              for suite in suites:
                  for key in counts:
                      counts[key] += int(float(suite.attrib.get(key, 0)))

          outcome = os.environ.get('CORE_OUTCOME', 'not_run')
          result = {
              'checkpoint': '1.1',
              'tested_sha': '${{ github.sha }}',
              'generated_at': datetime.now(timezone.utc).isoformat(),
              'passed': outcome == 'success',
              'states': {
                  'core_verification': outcome,
                  'python_compile': 'success' if junit.exists() else 'unknown',
                  'pytest_cumulative': 'success' if junit.exists() and counts['failures'] == 0 and counts['errors'] == 0 else outcome,
                  'javascript_syntax': 'success' if outcome == 'success' else 'see_log',
              },
              'pytest': counts,
              'browser_verification': 'eve-ai-studio/checkpoints/EVE_HQ_FINAL_VERIFICATION.json',
          }
          base = Path('eve-ai-studio/checkpoints')
          (base / 'CHECKPOINT_1.1_CI_RESULT.json').write_text(json.dumps(result, indent=2) + '\n', encoding='utf-8')
          log = Path('eve-core-cleanup.log').read_text(encoding='utf-8', errors='replace') if Path('eve-core-cleanup.log').exists() else 'Log non prodotto.'
          (base / 'CHECKPOINT_1.1_CI_RESULT.md').write_text(
              '# Checkpoint 1.1 — Verifica core automatica\n\n'
              f"- Commit verificato: `{result['tested_sha']}`\n"
              f"- Data UTC: `{result['generated_at']}`\n"
              f"- Esito: **{'SUPERATO' if result['passed'] else 'NON SUPERATO'}**\n\n"
              f"- pytest: {counts['tests']} test, {counts['failures']} fallimenti, {counts['errors']} errori, {counts['skipped']} ignorati\n\n"
              '## Coda log\n\n```text\n' + '\n'.join(log.splitlines()[-80:]) + '\n```\n',
              encoding='utf-8'
          )
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/eve-ai-studio-core-cleanup-verification.yml
          git add eve-ai-studio/checkpoints/CHECKPOINT_1.1_CI_RESULT.json eve-ai-studio/checkpoints/CHECKPOINT_1.1_CI_RESULT.md
          git commit -m "ci: registra verifica core conclusiva Eve 1.1 [skip eve core ci]"
          git pull --rebase origin eve-ai-studio
          git push origin HEAD:eve-ai-studio

      - name: Applica esito
        if: steps.core.outcome != 'success'
        run: exit 1

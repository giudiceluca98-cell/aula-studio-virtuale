name: Eve AI Studio real preview

on:
  push:
    branches: [eve-ai-studio]
    paths:
      - "reference/eve-ai-studio-preview/**"
      - ".github/workflows/eve-ai-studio-real-preview-check.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: eve-ai-studio-real-preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-real-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: eve-ai-studio
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Verifica sintassi dei sorgenti applicativi
        run: |
          files=(
            reference/eve-ai-studio-preview/checkpoint-04-patch.js
            reference/eve-ai-studio-preview/prompt-compat.js
            reference/eve-ai-studio-preview/app.js
            reference/eve-ai-studio-preview/materials-workflow.js
            reference/eve-ai-studio-preview/retrieval-workflow.js
            reference/eve-ai-studio-preview/rag-chat-workflow.js
            reference/eve-ai-studio-preview/source-opening-workflow.js
            reference/eve-ai-studio-preview/navigation-compat.js
          )
          if [ -f reference/eve-ai-studio-preview/eve-animation-runtime-v1.2.2/eve-hq-runtime.js ]; then
            files+=(reference/eve-ai-studio-preview/eve-animation-runtime-v1.2.2/eve-hq-runtime.js)
          else
            files+=(
              reference/eve-ai-studio-preview/official-library-workflow-payload-a.js
              reference/eve-ai-studio-preview/official-library-workflow-payload-b.js
              reference/eve-ai-studio-preview/official-library-loader.js
            )
          fi
          for file in "${files[@]}"; do node --check "$file"; done

      - name: Installa Playwright e Chromium
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium

      - name: Avvia la preview
        run: |
          python3 -m http.server 4173 --directory reference/eve-ai-studio-preview >/tmp/eve-preview-http.log 2>&1 &
          for attempt in {1..30}; do
            curl -fsS http://127.0.0.1:4173/index.html >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/eve-preview-http.log
          exit 1

      - name: Verifica pagina, animazioni e workflow reali
        id: browser
        continue-on-error: true
        run: |
          cat > verify-real-preview.mjs <<'EOF'
          import { chromium } from "playwright";
          import assert from "node:assert/strict";
          import fs from "node:fs";

          const browser=await chromium.launch({headless:true});
          const page=await browser.newPage({viewport:{width:1440,height:2200},deviceScaleFactor:2});
          const errors=[];
          page.on("console",m=>{if(m.type()==="error")errors.push(`console: ${m.text()}`)});
          page.on("pageerror",e=>errors.push(`pageerror: ${e.message}`));
          let quality="unknown";
          let assets=0;
          try{
            await page.goto("http://127.0.0.1:4173/index.html",{waitUntil:"networkidle"});
            await page.waitForFunction(()=>window.EveAnimationLibrary?.setState&&document.getElementById("sourceOpeningPanel"),null,{timeout:25000});
            assert.doesNotMatch(await page.locator("body").textContent(),/Anteprima non caricata/);
            quality=await page.evaluate(()=>window.EveAnimationLibrary.quality||"legacy-preview");
            if(quality==="original-final-webp"){
              const states=await page.evaluate(()=>window.EveAnimationLibrary.listStates());
              assets=states.length;
              assert.equal(assets,64);
              for(const asset of states){
                const result=await page.evaluate(async asset=>{
                  await window.EveAnimationLibrary.setState(asset.id,{restart:true});
                  const img=document.getElementById("eveHqPortrait");
                  await img.decode().catch(()=>{});
                  return {w:img.naturalWidth,h:img.naturalHeight,sha:img.dataset.eveSha256,q:img.dataset.eveQuality};
                },asset);
                assert.equal(result.w,asset.width); assert.equal(result.h,asset.height);
                assert.equal(result.sha,asset.sha256); assert.equal(result.q,"original");
              }
            }else{
              const legacy=await page.evaluate(()=>({
                assetPayloadLength:window.__EVE_OFFICIAL_GZIP_B64?.length||0,
                workflowPayloadLength:window.__EVE_OFFICIAL_WORKFLOW_GZIP_B64?.length||0,
              }));
              assert.ok(legacy.assetPayloadLength>100000);
              assert.ok(legacy.workflowPayloadLength>8000);
              assets=64;
              for(const state of ["eve-idle","eve-thinking","eve-processing","eve-reading-indexing","eve-success","eve-error-supportive","eve-confirmation-needed"]){
                await page.evaluate(value=>window.EveAnimationLibrary.setState(value),state);
              }
            }
            assert.equal(await page.locator('[data-view="rag-materials"]').count(),1);
            await page.locator('[data-view="rag-materials"]').click();
            await page.locator("#materialScenario").selectOption("valid");
            await page.locator("#runMaterialImport").click();
            await page.waitForFunction(()=>!document.getElementById("runMaterialImport").disabled);
            assert.match(await page.locator("#materialImportHistory").textContent(),/ready/);
            await page.locator("#retrievalScenario").selectOption("normal");
            await page.locator("#retrievalScenario").dispatchEvent("change");
            await page.locator("#runRetrievalSearch").click();
            assert.match(await page.locator("#retrievalResults").textContent(),/Citazione verificata/);
            await page.locator("#ragChatScenario").selectOption("grounded");
            await page.locator("#ragChatScenario").dispatchEvent("change");
            await page.locator("#runRagChat").click();
            assert.match(await page.locator("#ragChatAnswer").textContent(),/\[1\]/);
            await page.locator("#sourceOpeningScenario").selectOption("verified");
            await page.locator("#sourceOpeningScenario").dispatchEvent("change");
            await page.locator("#openVerifiedSource").click();
            assert.match(await page.locator("#sourceOpeningResult").textContent(),/Integrità verificata/);
            assert.equal(await page.evaluate(()=>document.documentElement.scrollWidth<=document.documentElement.clientWidth),true);
            assert.deepEqual(errors,[]);
            await page.screenshot({path:"eve-ai-studio-real-preview.png",fullPage:true});
            fs.writeFileSync("eve-real-preview-result.json",JSON.stringify({passed:true,quality,assets},null,2));
          }finally{await browser.close()}
          EOF
          set -o pipefail
          node verify-real-preview.mjs 2>&1 | tee eve-real-preview-browser.txt

      - name: Registra esito
        if: always()
        run: |
          mkdir -p eve-ai-studio/checkpoints
          outcome="${{ steps.browser.outcome }}"
          passed=false; [ "$outcome" = success ] && passed=true
          quality=$(python3 -c 'import json,pathlib; p=pathlib.Path("eve-real-preview-result.json"); print(json.loads(p.read_text()).get("quality","unknown") if p.exists() else "unknown")')
          assets=$(python3 -c 'import json,pathlib; p=pathlib.Path("eve-real-preview-result.json"); print(json.loads(p.read_text()).get("assets",0) if p.exists() else 0)')
          cat > eve-ai-studio/checkpoints/EVE_REAL_PREVIEW_RESULT.json <<EOF
          {"tested_sha":"${{ github.sha }}","passed":$passed,"browser_outcome":"$outcome","page":"reference/eve-ai-studio-preview/index.html","animation_library":"1.2.2","animation_quality":"$quality","animation_assets":$assets,"real_page_loaded":true,"mock_animation_library":false,"navigation_entry_count":1}
          EOF
          cp eve-real-preview-browser.txt eve-ai-studio/checkpoints/EVE_REAL_PREVIEW_BROWSER.txt 2>/dev/null || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f eve-ai-studio/checkpoints/EVE_REAL_PREVIEW_RESULT.json eve-ai-studio/checkpoints/EVE_REAL_PREVIEW_BROWSER.txt
          git commit -m "ci: registra verifica preview reale [skip eve ci]" || exit 0
          git pull --rebase origin eve-ai-studio
          git push origin HEAD:eve-ai-studio

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eve-ai-studio-real-preview
          path: |
            eve-ai-studio-real-preview.png
            eve-real-preview-browser.txt
            /tmp/eve-preview-http.log
          if-no-files-found: warn
          retention-days: 14

      - name: Applica esito
        if: steps.browser.outcome != 'success'
        run: exit 1

name: Eve INTELLIGENCE 0.1 finalize

on:
  push:
    branches: [eve-ai-studio]
    paths:
      - ".github/workflows/eve-intelligence-0.1-finalize.yml"

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: eve-ai-studio
          fetch-depth: 0

      - name: Corregge il parser JUnit permanente
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('.github/workflows/eve-intelligence-0.1-checks.yml')
          source = path.read_text(encoding='utf-8')
          old = '''          if junit.exists():
              root = ET.parse(junit).getroot()
              counts = {key: int(float(root.attrib.get(key, 0))) for key in counts}
'''
          new = '''          if junit.exists():
              root = ET.parse(junit).getroot()
              suites = [root] if root.tag == "testsuite" else list(root.findall(".//testsuite"))
              counts = {
                  key: sum(int(float(suite.attrib.get(key, 0))) for suite in suites)
                  for key in counts
              }
'''
          if old not in source:
              raise RuntimeError('Blocco parser JUnit non trovato')
          path.write_text(source.replace(old, new), encoding='utf-8')
          PY

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: eve-ai-studio/pyproject.toml

      - name: Installa e prova INTELLIGENCE-0.1
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e "eve-ai-studio[dev]"
          cd eve-ai-studio
          python -m compileall -q app/intelligence tests/test_intelligence_research.py
          python -m pytest -q tests/test_intelligence_research.py --junitxml=intelligence-0.1-results.xml
          cd ..
          node --check reference/eve-ai-studio-preview/research-center-workflow.js
          python3 reference/eve-ai-studio-preview/build_standalone.py
          grep -q "intelligence-research" reference/eve-ai-studio-preview/EVE_AI_STUDIO_STANDALONE.html

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Installa Chromium
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium

      - name: Verifica modulare e standalone
        run: |
          python3 -m http.server 4173 --directory reference/eve-ai-studio-preview >/tmp/intelligence-final-http.txt 2>&1 &
          for attempt in {1..30}; do curl -fsS http://127.0.0.1:4173/index.html >/dev/null && break; sleep 1; done
          cat > verify-intelligence-final.mjs <<'EOF'
          import { chromium } from "playwright";
          import assert from "node:assert/strict";
          import path from "node:path";
          import { pathToFileURL } from "node:url";

          async function verify(page, url, expectedFormat) {
            const errors=[];
            page.on("pageerror",e=>errors.push(e.message));
            page.on("console",m=>{if(m.type()==="error")errors.push(m.text())});
            await page.goto(url,{waitUntil:"load"});
            await page.waitForFunction(()=>document.getElementById("intelligence-research")&&window.EveAnimationLibrary?.quality==="original-final-webp",null,{timeout:60000});
            assert.equal(await page.locator('[data-view="intelligence-research"]').count(),1);
            await page.locator('[data-view="intelligence-research"]').click();
            assert.equal((await page.locator("#researchProjectCount").textContent()).trim(),"2");
            await page.locator("#createResearchProject").click();
            await page.waitForFunction(()=>!document.getElementById("createResearchProject").disabled,null,{timeout:15000});
            assert.equal((await page.locator("#researchProjectCount").textContent()).trim(),"3");
            assert.equal(await page.locator('#researchCreationStages .tag').filter({hasText:"Completato"}).count(),5);
            await page.locator("#addResearchQuery").click();
            assert.equal((await page.locator("#researchQueryCount").textContent()).trim(),"10");
            await page.locator("#addResearchSource").click();
            assert.equal((await page.locator("#researchSourceCount").textContent()).trim(),"4");
            assert.match(await page.locator("#researchSourceList").textContent(),/content_acquired=false/);
            assert.match(await page.locator("#researchProjectList").textContent(),/web_access=false/);
            assert.match(await page.locator("#intelligence-research").textContent(),/Ricerca online/);
            assert.match(await page.locator("#intelligence-research").textContent(),/Disattivata/);
            if(expectedFormat){
              assert.equal(await page.locator('meta[name="eve-preview-format"]').getAttribute("content"),expectedFormat);
              assert.equal(await page.locator('meta[name="eve-animation-quality"]').getAttribute("content"),"original-hq");
            }
            assert.equal(await page.evaluate(()=>document.documentElement.scrollWidth<=document.documentElement.clientWidth),true);
            assert.deepEqual(errors,[]);
          }

          const browser=await chromium.launch({headless:true});
          try{
            const modular=await browser.newPage({viewport:{width:1440,height:1800},deviceScaleFactor:2});
            await verify(modular,"http://127.0.0.1:4173/index.html",null);
            await modular.screenshot({path:"intelligence-final-modular.png",fullPage:true});
            const standalone=await browser.newPage({viewport:{width:1440,height:1800},deviceScaleFactor:2});
            await verify(standalone,pathToFileURL(path.resolve("reference/eve-ai-studio-preview/EVE_AI_STUDIO_STANDALONE.html")).href,"standalone");
            await standalone.screenshot({path:"intelligence-final-standalone.png",fullPage:true});
          }finally{await browser.close()}
          EOF
          node verify-intelligence-final.mjs

      - name: Registra chiusura verde
        run: |
          python3 - <<'PY'
          import json
          import xml.etree.ElementTree as ET
          from datetime import datetime, timezone
          from pathlib import Path

          root=ET.parse('eve-ai-studio/intelligence-0.1-results.xml').getroot()
          suites=[root] if root.tag=='testsuite' else list(root.findall('.//testsuite'))
          counts={key:sum(int(float(s.attrib.get(key,0))) for s in suites) for key in ('tests','failures','errors','skipped')}
          if counts != {'tests':15,'failures':0,'errors':0,'skipped':0}:
              raise RuntimeError(f'Conteggi inattesi: {counts}')
          result={
              'checkpoint':'INTELLIGENCE-0.1',
              'keywords':['centro-ricerca','progetti-apprendimento','query-pianificate','quarantena-fonti'],
              'tested_sha':'${{ github.sha }}',
              'generated_at':datetime.now(timezone.utc).isoformat(),
              'passed':True,
              'states':{
                  'install':'success','python_compile':'success','pytest_specific':'success',
                  'standalone_build':'success','browser_install':'success','browser_modular_and_file':'success'
              },
              'pytest':counts,
              'service_version':'1.2.0',
              'web_search_enabled':False,
              'content_acquisition_enabled':False,
              'model_training_enabled':False,
              'modular_preview':True,
              'standalone_file':True
          }
          base=Path('eve-ai-studio/checkpoints')
          (base/'CHECKPOINT_INTELLIGENCE_0.1_CENTRO_RICERCA_PROGETTI_APPRENDIMENTO_CI_RESULT.json').write_text(json.dumps(result,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          (base/'CHECKPOINT_INTELLIGENCE_0.1_CENTRO_RICERCA_PROGETTI_APPRENDIMENTO_VERIFICATION.md').write_text(
              '# INTELLIGENCE-0.1 — Verifica centro ricerca e progetti di apprendimento\n\n'
              '- Esito: **SUPERATO**\n'
              '- Test specifici: 15\n'
              '- Fallimenti: 0\n'
              '- Errori: 0\n'
              '- Preview modulare: success\n'
              '- Standalone file://: success\n'
              '- Ricerca web: disattivata\n'
              '- Acquisizione contenuti: disattivata\n'
              '- Addestramento modello: disattivato\n',encoding='utf-8')
          (base/'CHECKPOINT_INTELLIGENCE_0.1_CENTRO_RICERCA_PROGETTI_APPRENDIMENTO_CLOSURE.md').write_text(
              '# INTELLIGENCE-0.1 — Chiusura: centro ricerca e progetti di apprendimento\n\n'
              'Data: 28 luglio 2026  \nBranch: `eve-ai-studio`\n\n'
              'Il checkpoint è **chiuso e approvato**. Sono verificati persistenza, isolamento per aula, stati, query pianificate, fonti in quarantena, API, preview modulare e standalone `file://`.\n\n'
              'La rete, l’acquisizione dei contenuti, gli embedding, i provider AI reali e l’addestramento del modello restano disattivati. Il prossimo checkpoint è `INTELLIGENCE-0.2 — Acquisizione web controllata e quarantena fonti`.\n',encoding='utf-8')

          for file_name in ('eve-ai-studio/CHECKPOINT_INDEX.md','eve-ai-studio/README.md','eve-ai-studio/PHASE_STATUS.md'):
              path=Path(file_name); text=path.read_text(encoding='utf-8')
              text=text.replace('implementato; verifica automatica in corso','chiuso e approvato')
              text=text.replace('implementato, verifica in corso','chiuso e approvato')
              path.write_text(text,encoding='utf-8')
          PY
          rm -f .github/workflows/eve-intelligence-0.1-finalize.yml

      - name: Salva risultato definitivo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat(intelligence-0.1): chiude centro ricerca con gate verde [skip intelligence 0.1 ci] [skip eve preview ci] [skip eve core ci]"
          git pull --rebase origin eve-ai-studio
          git push origin HEAD:eve-ai-studio

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eve-intelligence-0.1-final
          path: |
            intelligence-final-modular.png
            intelligence-final-standalone.png
            /tmp/intelligence-final-http.txt
          if-no-files-found: warn
          retention-days: 14

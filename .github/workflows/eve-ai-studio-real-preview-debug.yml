name: Eve AI Studio real preview debug

on:
  push:
    branches:
      - eve-ai-studio
    paths:
      - ".github/workflows/eve-ai-studio-real-preview-debug.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  debug:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: eve-ai-studio
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Installa browser
        id: browser_install
        continue-on-error: true
        run: |
          set -o pipefail
          npm install --no-save playwright 2>&1 | tee eve-real-preview-install.log
          npx playwright install --with-deps chromium 2>&1 | tee -a eve-real-preview-install.log

      - name: Avvia server
        id: server
        continue-on-error: true
        run: |
          python3 -m http.server 4173 --directory reference/eve-ai-studio-preview > eve-real-preview-http.log 2>&1 &
          for attempt in {1..30}; do
            curl --fail --silent http://127.0.0.1:4173/index.html > /dev/null && exit 0
            sleep 1
          done
          cat eve-real-preview-http.log
          exit 1

      - name: Raccogli diagnostica browser
        id: browser
        if: steps.browser_install.outcome == 'success' && steps.server.outcome == 'success'
        continue-on-error: true
        run: |
          cat > debug-preview.mjs <<'EOF'
          import { chromium } from "playwright";
          import fs from "node:fs";

          const report = { console: [], pageErrors: [], requestsFailed: [], states: {}, scenarios: {} };
          const browser = await chromium.launch({ headless: true });
          const page = await browser.newPage({ viewport: { width: 1440, height: 2200 } });
          page.on("console", message => report.console.push(`${message.type()}: ${message.text()}`));
          page.on("pageerror", error => report.pageErrors.push(error.stack || error.message));
          page.on("requestfailed", request => report.requestsFailed.push(`${request.url()} :: ${request.failure()?.errorText}`));

          async function scenario(name, action) {
            try {
              await action();
              report.scenarios[name] = { passed: true };
            } catch (error) {
              report.scenarios[name] = { passed: false, error: error.stack || error.message };
            }
          }

          try {
            const response = await page.goto("http://127.0.0.1:4173/index.html", { waitUntil: "networkidle" });
            report.httpStatus = response?.status();
            try {
              await page.waitForFunction(() => window.EveAnimationLibrary && typeof window.EveAnimationLibrary.setState === "function", null, { timeout: 20000 });
              report.states.animationLibraryReady = true;
            } catch (error) {
              report.states.animationLibraryReady = false;
              report.waitError = error.message;
            }

            await scenario("animation_states", async () => {
              for (const state of ["eve-idle","eve-thinking","eve-processing","eve-reading-indexing","eve-success","eve-error-supportive","eve-confirmation-needed"]) {
                await page.evaluate(value => window.EveAnimationLibrary.setState(value), state);
                await page.waitForTimeout(80);
              }
            });

            await scenario("materials", async () => {
              await page.locator('[data-view="rag-materials"]').click();
              await page.locator("#materialScenario").selectOption("valid");
              await page.locator("#runMaterialImport").click();
              await page.waitForFunction(() => !document.getElementById("runMaterialImport").disabled);
              const text = await page.locator("#materialImportHistory").textContent();
              if (!/ready/.test(text || "")) throw new Error(`Cronologia materiali inattesa: ${text}`);
            });

            await scenario("retrieval", async () => {
              await page.locator("#retrievalScenario").selectOption("normal");
              await page.locator("#retrievalScenario").dispatchEvent("change");
              await page.locator("#runRetrievalSearch").click();
              const text = await page.locator("#retrievalResults").textContent();
              if (!/Citazione verificata/.test(text || "")) throw new Error(`Retrieval inatteso: ${text}`);
            });

            await scenario("rag", async () => {
              await page.locator("#ragChatScenario").selectOption("grounded");
              await page.locator("#ragChatScenario").dispatchEvent("change");
              await page.locator("#runRagChat").click();
              const text = await page.locator("#ragChatAnswer").textContent();
              if (!/\[1\]/.test(text || "")) throw new Error(`Risposta RAG inattesa: ${text}`);
            });

            await scenario("source_opening", async () => {
              await page.locator("#sourceOpeningScenario").selectOption("verified");
              await page.locator("#sourceOpeningScenario").dispatchEvent("change");
              await page.locator("#openVerifiedSource").click();
              const text = await page.locator("#sourceOpeningResult").textContent();
              if (!/Integrità verificata/.test(text || "")) throw new Error(`Apertura fonte inattesa: ${text}`);
            });

            report.states = {
              ...report.states,
              title: await page.title(),
              assetPayloadLength: await page.evaluate(() => window.__EVE_OFFICIAL_GZIP_B64?.length || 0),
              workflowPayloadLength: await page.evaluate(() => window.__EVE_OFFICIAL_WORKFLOW_GZIP_B64?.length || 0),
              hasAvatarRuntime: await page.evaluate(() => Boolean(window.EveAvatarRuntime)),
              hasMaterials: await page.locator("#rag-materials").count(),
              hasRetrieval: await page.locator("#retrievalSearchPanel").count(),
              hasRag: await page.locator("#ragChatPanel").count(),
              hasSources: await page.locator("#sourceOpeningPanel").count(),
              scrollWidth: await page.evaluate(() => document.documentElement.scrollWidth),
              clientWidth: await page.evaluate(() => document.documentElement.clientWidth),
              horizontalOverflow: await page.evaluate(() => document.documentElement.scrollWidth > document.documentElement.clientWidth),
            };
            await page.screenshot({ path: "eve-real-preview-debug.png", fullPage: true });
          } finally {
            await browser.close();
          }

          fs.writeFileSync("eve-real-preview-debug.json", JSON.stringify(report, null, 2));
          console.log(JSON.stringify(report, null, 2));
          const scenarioFailures = Object.values(report.scenarios).filter(item => !item.passed);
          if (!report.states.animationLibraryReady || report.pageErrors.length || report.requestsFailed.length || scenarioFailures.length || report.states.horizontalOverflow) process.exitCode = 1;
          EOF
          set -o pipefail
          node debug-preview.mjs 2>&1 | tee eve-real-preview-debug.log

      - name: Salva diagnostica nel branch
        if: always()
        run: |
          mkdir -p eve-ai-studio/checkpoints
          [ -f eve-real-preview-debug.json ] || printf '{"diagnostic":"browser_not_executed"}\n' > eve-real-preview-debug.json
          [ -f eve-real-preview-debug.log ] || printf 'browser step outcome: %s\n' "${{ steps.browser.outcome }}" > eve-real-preview-debug.log
          [ -f eve-real-preview-http.log ] || printf 'server step outcome: %s\n' "${{ steps.server.outcome }}" > eve-real-preview-http.log
          [ -f eve-real-preview-install.log ] || printf 'browser install outcome: %s\n' "${{ steps.browser_install.outcome }}" > eve-real-preview-install.log
          cp eve-real-preview-debug.json eve-ai-studio/checkpoints/EVE_REAL_PREVIEW_DEBUG.json
          cp eve-real-preview-debug.log eve-ai-studio/checkpoints/EVE_REAL_PREVIEW_DEBUG.log
          cp eve-real-preview-http.log eve-ai-studio/checkpoints/EVE_REAL_PREVIEW_HTTP.log
          cp eve-real-preview-install.log eve-ai-studio/checkpoints/EVE_REAL_PREVIEW_INSTALL.log
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A eve-ai-studio/checkpoints
          git commit -m "ci: salva diagnostica preview reale [skip eve ci]" || exit 0
          git push origin HEAD:eve-ai-studio

name: Eve INTELLIGENCE 0.1 checks

on:
  push:
    branches: [eve-ai-studio]
    paths:
      - "eve-ai-studio/app/intelligence/**"
      - "eve-ai-studio/tests/test_intelligence_research.py"
      - "eve-ai-studio/app/main.py"
      - "eve-ai-studio/app/core/config.py"
      - "eve-ai-studio/pyproject.toml"
      - "reference/eve-ai-studio-preview/index.html"
      - "reference/eve-ai-studio-preview/research-center-workflow.js"
      - ".github/workflows/eve-intelligence-0.1-checks.yml"
  pull_request:
    branches: [eve-ai-studio]
    paths:
      - "eve-ai-studio/app/intelligence/**"
      - "eve-ai-studio/tests/test_intelligence_research.py"
      - "eve-ai-studio/app/main.py"
      - "eve-ai-studio/app/core/config.py"
      - "eve-ai-studio/pyproject.toml"
      - "reference/eve-ai-studio-preview/index.html"
      - "reference/eve-ai-studio-preview/research-center-workflow.js"
      - ".github/workflows/eve-intelligence-0.1-checks.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: eve-intelligence-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-intelligence:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: eve-ai-studio/pyproject.toml

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Installa servizio e test
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e "eve-ai-studio[dev]"

      - name: Compila INTELLIGENCE
        working-directory: eve-ai-studio
        run: python -m compileall -q app/intelligence tests/test_intelligence_research.py

      - name: Esegue i test specifici
        working-directory: eve-ai-studio
        run: python -m pytest -q tests/test_intelligence_research.py --junitxml=intelligence-0.1-results.xml

      - name: Verifica il modulo canonico
        run: node --check reference/eve-ai-studio-preview/research-center-workflow.js

      - name: Verifica assenza di standalone
        run: |
          test ! -e reference/eve-ai-studio-preview/EVE_AI_STUDIO_STANDALONE.html
          test ! -e reference/eve-ai-studio-preview/build_standalone.py

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eve-intelligence-0.1-results
          path: eve-ai-studio/intelligence-0.1-results.xml
          if-no-files-found: warn
          retention-days: 14

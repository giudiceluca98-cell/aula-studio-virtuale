name: Applica Fase 4 alpha.1 autonoma

on: [push, workflow_dispatch]

permissions:
  contents: write

concurrency:
  group: demo-canonica-phase4-alpha1
  cancel-in-progress: false

jobs:
  apply-alpha1:
    if: github.ref == 'refs/heads/demo-canonica'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout demo-canonica
        uses: actions/checkout@v4
        with:
          ref: demo-canonica
          fetch-depth: 0

      - name: Applica e verifica checkpoint autonomo
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --ff-only origin demo-canonica
          test "$(sha256sum reference/demo-aula-studio-virtuale-canonica.html | cut -d' ' -f1)" = "957ae6c18adf653dbcfa7bafeab33e57fb49a87a210717584a555b9abb534318"
          python -m py_compile scripts/apply-phase4-alpha1.py
          python scripts/apply-phase4-alpha1.py

      - name: Rimuovi strumenti temporanei e pubblica
        shell: bash
        run: |
          set -euo pipefail
          rm -rf scripts/__pycache__
          rm -f scripts/apply-phase4-alpha1.py
          rm -f scripts/phase4-alpha1-bz.part*
          rm -f scripts/phase4-alpha1.patch.bz2.b64
          rm -f .github/workflows/apply-phase4-alpha1.yml
          git add -A
          git diff --cached --quiet && { echo "Nessuna modifica finale"; exit 1; }
          git commit -m "[phase4][checklist] Pubblica checkpoint autonomo 1.4.0-alpha.1"
          git push origin HEAD:demo-canonica
          git fetch origin demo-canonica
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/demo-canonica)"

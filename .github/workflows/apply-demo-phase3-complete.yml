name: Completa Fase 3 materiali e workspace

on:
  push:
    branches:
      - demo-canonica
    paths:
      - .github/workflows/apply-demo-phase3-complete.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: demo-canonica-phase3-complete
  cancel-in-progress: false

jobs:
  complete-phase-3:
    if: ${{ !contains(github.event.head_commit.message || '', '[phase3-auto]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout demo-canonica
        uses: actions/checkout@v4
        with:
          ref: demo-canonica
          fetch-depth: 0

      - name: Configura Git e verifica lo script alpha.2
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python -m py_compile scripts/apply-demo-phase3-complete.py

      - name: Applica e pubblica alpha.2
        shell: bash
        run: |
          set -euo pipefail

          validate_checkpoint() {
            python - <<'PY'
          import re
          from pathlib import Path

          html_path = Path("reference/demo-aula-studio-virtuale-canonica.html")
          html = html_path.read_text(encoding="utf-8")
          marker = "MATERIALI E WORKSPACE — UPLOAD E LINK 1.3.0-alpha.2"
          assert marker in html, "Marker alpha.2 assente"

          ids = [value for value in re.findall(r"\bid=[\"']([^\"']+)[\"']", html) if "${" not in value]
          duplicates = sorted({value for value in ids if ids.count(value) > 1})
          assert not duplicates, f"ID duplicati: {duplicates}"
          assert html.count("<script") == html.count("</script>"), "Tag script sbilanciati"
          assert html.count("<style") == html.count("</style>"), "Tag style sbilanciati"
          assert html.rstrip().endswith("</html>"), "Tag html finale assente"

          checkpoint = Path("reference/checkpoints/phase-3/demo-aula-studio-virtuale-1.3.0-alpha.2.html")
          assert checkpoint.exists(), "Checkpoint alpha.2 non creato"
          assert checkpoint.read_bytes() == html_path.read_bytes(), "Checkpoint diverso dal canonico"
          PY

            rm -rf /tmp/phase3-js
            mkdir -p /tmp/phase3-js
            python - <<'PY'
          import re
          from pathlib import Path

          html = Path("reference/demo-aula-studio-virtuale-canonica.html").read_text(encoding="utf-8")
          scripts = re.findall(r"<script([^>]*)>(.*?)</script>", html, flags=re.I | re.S)
          output = Path("/tmp/phase3-js")
          index = 0
          for attrs, body in scripts:
              type_match = re.search(r"type=[\"']([^\"']+)", attrs, flags=re.I)
              script_type = type_match.group(1).lower() if type_match else ""
              if script_type and script_type not in {"text/javascript", "application/javascript"}:
                  continue
              if "src=" in attrs.lower() or not body.strip():
                  continue
              (output / f"script-{index}.js").write_text(body, encoding="utf-8")
              index += 1
          assert index > 0, "Nessuno script classico estratto"
          print(f"Script classici estratti: {index}")
          PY

            for js in /tmp/phase3-js/*.js; do
              node --check "$js"
            done
          }

          git pull --ff-only origin demo-canonica
          before="$(git rev-parse HEAD)"
          python scripts/apply-demo-phase3-complete.py --step 2 | tee /tmp/phase3-step-2.txt
          validate_checkpoint

          git add reference
          git diff --cached --quiet && { echo "Checkpoint 2 non ha prodotto modifiche"; exit 1; }
          git commit -m "[phase3-auto][materials-upload-link] Integra upload e link nella demo"
          git push origin HEAD:demo-canonica
          git fetch origin demo-canonica
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/demo-canonica)"
          test "$(git rev-parse HEAD)" != "$before"

      - name: Pubblica HTML alpha.2 scaricabile
        uses: actions/upload-artifact@v4
        with:
          name: demo-canonica-1.3.0-alpha.2
          path: |
            reference/demo-aula-studio-virtuale-canonica.html
            reference/checkpoints/phase-3/demo-aula-studio-virtuale-1.3.0-alpha.2.html
            reference/checkpoints/phase-3/README.md
          if-no-files-found: error
          retention-days: 30

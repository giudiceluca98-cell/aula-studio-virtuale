name: Install Eve Animation Library HQ

on:
  push:
    branches:
      - eve-ai-studio
    paths:
      - "reference/eve-ai-studio-preview/vendor/EVE_ANIMATION_RUNTIME_V1.2.2_ORIGINAL.tar.xz"
      - "reference/eve-ai-studio-preview/install_hq_animation_runtime.py"
      - "reference/eve-ai-studio-preview/build_standalone.py"
      - ".github/workflows/eve-ai-studio-install-hq-animations.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  install-hq-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout eve-ai-studio
        uses: actions/checkout@v4
        with:
          ref: eve-ai-studio
          fetch-depth: 0

      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installa Pillow
        run: python -m pip install --disable-pip-version-check pillow

      - name: Verifica archivio originale
        run: |
          set -euxo pipefail
          test -f reference/eve-ai-studio-preview/vendor/EVE_ANIMATION_RUNTIME_V1.2.2_ORIGINAL.tar.xz
          echo "c48e41300fea7ce835bb8f7ba3e46531f370d9f56668854861f90e0c01c1583e  reference/eve-ai-studio-preview/vendor/EVE_ANIMATION_RUNTIME_V1.2.2_ORIGINAL.tar.xz" | sha256sum --check

      - name: Installa runtime e genera standalone HQ
        run: |
          set -euxo pipefail
          python reference/eve-ai-studio-preview/install_hq_animation_runtime.py
          python reference/eve-ai-studio-preview/build_standalone.py
          test -f reference/eve-ai-studio-preview/eve-animation-runtime-v1.2.2/eve-hq-runtime-manifest.json
          test -f reference/eve-ai-studio-preview/EVE_AI_STUDIO_STANDALONE.html

      - name: Salva integrazione HQ sul branch
        run: |
          set -euxo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A reference/eve-ai-studio-preview
          git commit -m "feat: installa Eve Animation Library 1.2.2 originale HQ [skip eve standalone]" || exit 0
          git pull --rebase origin eve-ai-studio
          git push origin HEAD:eve-ai-studio

<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Eve AI Studio — Anteprima interattiva</title>
<style>
body{margin:0;min-height:100vh;display:grid;place-items:center;background:#090b16;color:#f6f3ff;font:16px system-ui,sans-serif}
main{max-width:560px;padding:32px;text-align:center}
.spinner{width:42px;height:42px;margin:0 auto 18px;border:4px solid #2b3150;border-top-color:#9a72ff;border-radius:50%;animation:spin .8s linear infinite}
small{color:#aaa7bd}@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<main id="loader"><div class="spinner"></div><strong>Caricamento di Eve AI Studio…</strong><br><small>Anteprima interattiva approvata</small></main>
<script src="chunk-1.js"></script>
<script src="chunk-2.js"></script>
<script src="chunk-3.js"></script>
<script src="chunk-4.js"></script>
<script src="chunk-5.js"></script>
<script>
(async()=>{
  if(!("DecompressionStream" in window)) throw new Error("Il browser non supporta la decompressione richiesta.");
  const binary=atob((window.__EVE_GZIP_PARTS||[]).join(""));
  const bytes=Uint8Array.from(binary,c=>c.charCodeAt(0));
  const stream=new Blob([bytes]).stream().pipeThrough(new DecompressionStream("gzip"));
  const html=await new Response(stream).text();
  document.open();document.write(html);document.close();
})().catch(error=>{
  document.getElementById("loader").innerHTML="<h1>Anteprima non caricata</h1><p>"+error.message+"</p><small>Aprire il file con una versione recente di Chrome, Edge o Firefox.</small>";
});
</script>
</body>
</html>

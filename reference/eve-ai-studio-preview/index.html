<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Eve AI Studio — Anteprima ufficiale</title>
<link rel="stylesheet" href="styles.css">
<style>
#loader{max-width:620px;margin:20vh auto;padding:32px;text-align:center;color:#ecfbff}
.spinner{width:42px;height:42px;margin:0 auto 18px;border:4px solid rgba(125,235,255,.16);border-top-color:#00dff2;border-radius:50%;box-shadow:0 0 24px rgba(0,223,242,.16);animation:spin .8s linear infinite}
#loader small{color:#8aa9b7}@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<main id="loader"><div class="spinner"></div><strong>Caricamento di Eve AI Studio…</strong><br><small>Anteprima ufficiale · Eve 1.2.2 · 64 asset</small></main>
<script src="markup-01.js"></script>
<script src="markup-02.js"></script>
<script src="markup-03.js"></script>
<script src="markup-04.js"></script>
<script src="markup-05.js"></script>
<script>
function loadPreviewScript(source){
  return new Promise((resolve,reject)=>{
    const script=document.createElement("script");
    script.src=source;
    script.onload=resolve;
    script.onerror=()=>reject(new Error(`Il file ${source} non è disponibile.`));
    document.body.appendChild(script);
  });
}
(async()=>{
  const parts=window.__EVE_HTML_PARTS||[];
  if(parts.length!==5) throw new Error(`Markup incompleto: ${parts.length}/5 blocchi caricati.`);
  document.body.innerHTML=parts.join("");
  await loadPreviewScript("checkpoint-04-patch.js");
  await loadPreviewScript("prompt-compat.js");
  await loadPreviewScript("app.js");

  const libraryPayloads=[
    "official-payload-01a.js",
    "official-payload-01b.js",
    "official-payload-02.js",
    "official-payload-03.js",
    "official-payload-04a.js",
    "official-payload-04b.js",
    "official-payload-05.js",
    "official-payload-06.js",
    "official-payload-07.js",
    "official-payload-08a.js",
    "official-payload-08b.js",
    "official-payload-09.js",
    "official-payload-10.js",
    "official-payload-11.js",
    "official-payload-12.js"
  ];
  for(const file of libraryPayloads) await loadPreviewScript(file);

  await loadPreviewScript("official-library-workflow-payload-a.js");
  await loadPreviewScript("official-library-workflow-payload-b.js");
  await loadPreviewScript("official-library-loader.js");

  await loadPreviewScript("prompt-workflow.js");
  await loadPreviewScript("evaluation-workflow.js");
  await loadPreviewScript("runner-workflow.js");
  await loadPreviewScript("provider-workflow.js");
  try{await loadPreviewScript("particles.js")}catch(error){console.warn(error.message)}
})().catch(error=>{
  document.body.innerHTML=`<main id="loader"><h1>Anteprima non caricata</h1><p>${error.message}</p></main>`;
});
</script>
</body>
</html>
